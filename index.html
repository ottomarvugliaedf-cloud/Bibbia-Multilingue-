// ---------- Visualizzatore cartina (zoom, trascinamento, quadrato evidenziato) ----------
const bpV = { map: null, cells: [], label: "", s: 1, x: 0, y: 0, fit: 1, minS: 0.5, maxS: 8, w: 0, h: 0, ptrs: new Map(), d0: 0, s0: 1, ax: 0, ay: 0, lastTap: 0, lastTapX: 0, lastTapY: 0, bound: false };
function bpMapById(id) { return (bpMeta && bpMeta.maps || []).find(m => m.id === id); }
function bpPages(pages) { return pages && pages.length ? (pages.length > 1 ? "pp. " : "p. ") + pages.join("–") : ""; }

function bpParseCell(c, grid) {
  const m = /^([A-Z])(\d{1,2})$/.exec(c || "");
  if (!m || !grid) return null;
  const col = m[1].charCodeAt(0) - 65, row = parseInt(m[2], 10) - 1;
  if (col < 0 || col >= grid.cols || row < 0 || row >= grid.rows) return null;
  const side = bpV.w / grid.cols;   // le celle sono quadrate: lato = larghezza / colonne (l'ultima riga può essere tagliata dal bordo)
  return { col, row, cw: side, ch: side };
}
async function openMapViewer(mapId, cells, label, fromBack = false) {
  const meta = await bpGetMeta();
  if (!meta) return;
  const map = bpMapById(mapId);
  if (!map) return;
  if (!fromBack && document.getElementById("mapsViewer").style.display !== "flex") {
    saveCurrentPositionToHistory();
  }
  bpV.map = map;
  bpV.cells = (cells || []).slice();
  bpV.label = label || "";
  bpV.w = map.image.width; bpV.h = map.image.height;
  document.getElementById("mapsViewer").style.display = "flex";
  document.getElementById("bpVTitle").textContent = map.title;
  document.getElementById("bpVSub").textContent = `${map.chapterTitle} · ${bpPages(map.pages)}`;
  const sheet = document.getElementById("bpSheet");
  sheet.classList.remove("open");
  sheet.innerHTML = "";
  const wrap = document.getElementById("bpWrap");
  const img = document.getElementById("bpImg");
  const msg = document.getElementById("bpMsg");
  msg.textContent = "Caricamento cartina HD...";
  msg.style.display = "block";
  wrap.style.visibility = "hidden";
  const uri = await bpDbGet(BP_DB_IMG + mapId);
  if (!uri) { msg.textContent = "Immagine non trovata. Ricarica il file JSON dal Backup."; return; }
  img.onload = () => {
    msg.style.display = "none";
    wrap.style.width = bpV.w + "px"; wrap.style.height = bpV.h + "px";
    img.style.width = bpV.w + "px"; img.style.height = bpV.h + "px";
    wrap.style.visibility = "visible";
    bpBindGestures();
    bpDrawHighlights();
    bpFitView();
    if (bpV.cells.length) bpZoomToCell(bpV.cells[0]);
    bpRenderChips();
  };
  img.src = uri;
}
function closeMapViewer() {
  document.getElementById("mapsViewer").style.display = "none";
  document.getElementById("bpImg").removeAttribute("src");
}
function bpClamp() {
  const stage = document.getElementById("bpStage");
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const w = bpV.w * bpV.s, h = bpV.h * bpV.s;
  bpV.x = w <= sw ? (sw - w) / 2 : Math.min(0, Math.max(sw - w, bpV.x));
  bpV.y = h <= sh ? (sh - h) / 2 : Math.min(0, Math.max(sh - h, bpV.y));
}
function bpApply() {
  bpClamp();
  const wrap = document.getElementById("bpWrap");
  wrap.style.transform = `translate(${bpV.x}px, ${bpV.y}px) scale(${bpV.s})`;
  wrap.style.setProperty("--inv", String(1 / bpV.s));
}
function bpFitView() {
  const stage = document.getElementById("bpStage");
  bpV.fit = Math.min(stage.clientWidth / bpV.w, stage.clientHeight / bpV.h);
  bpV.minS = bpV.fit * 0.9;
  bpV.maxS = Math.max(bpV.fit * 10, 2);
  bpV.s = bpV.fit; bpV.x = 0; bpV.y = 0;
  bpApply();
}
function bpZoomAt(factor, px, py) {
  const ns = Math.min(bpV.maxS, Math.max(bpV.minS, bpV.s * factor));
  const ix = (px - bpV.x) / bpV.s, iy = (py - bpV.y) / bpV.s;
  bpV.s = ns; bpV.x = px - ix * ns; bpV.y = py - iy * ns;
  bpApply();
}
function bpZoomBtn(f) {
  const stage = document.getElementById("bpStage");
  bpZoomAt(f, stage.clientWidth / 2, stage.clientHeight / 2);
}
function bpZoomToCell(cell) {
  const c = bpParseCell(cell, bpV.map.grid);
  if (!c) return;
  const stage = document.getElementById("bpStage");
  const s = Math.min(bpV.maxS, Math.max(bpV.fit, (Math.min(stage.clientWidth, stage.clientHeight) / 3) / Math.max(c.cw, c.ch)));
  bpV.s = s;
  bpV.x = stage.clientWidth / 2 - (c.col + 0.5) * c.cw * s;
  bpV.y = stage.clientHeight / 2 - (c.row + 0.5) * c.ch * s;
  bpApply();
}
function bpDrawHighlights() {
  const wrap = document.getElementById("bpWrap");
  wrap.querySelectorAll(".bp-hl").forEach(n => n.remove());
  bpV.cells.forEach(cell => {
    const c = bpParseCell(cell, bpV.map.grid);
    if (!c) return;
    const d = document.createElement("div");
    d.className = "bp-hl";
    d.style.left = (c.col * c.cw) + "px"; d.style.top = (c.row * c.ch) + "px";
    d.style.width = c.cw + "px"; d.style.height = c.ch + "px";
    wrap.appendChild(d);
  });
}
function bpRenderChips() {
  const el = document.getElementById("bpChips");
  const map = bpV.map;
  let html = "";
  if (bpV.cells.length) {
    html += `<span class="bp-chiplabel">${bpV.label ? escapeHtml(bpV.label) + " · " : ""}quadrato</span>` +
      bpV.cells.map(c => `<button class="bp-chip" onclick="bpZoomToCell('${c}')">${c}</button>`).join("");
  } else if (map.hasGrid) {
    html += `<span class="bp-chiplabel">Griglia ${map.grid.letters[0]}–${map.grid.letters[map.grid.letters.length - 1]} × 1–${map.grid.rows}. Tocca 📋 per l’elenco dei luoghi.</span>`;
  } else {
    html += `<span class="bp-chiplabel">Cartina senza griglia. Tocca 📋 per l’elenco dei nomi.</span>`;
  }
  el.innerHTML = html;
}
function bpBindGestures() {
  if (bpV.bound) return;
  bpV.bound = true;
  const stage = document.getElementById("bpStage");
  const pos = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  stage.addEventListener("pointerdown", e => {
    stage.setPointerCapture(e.pointerId);
    bpV.ptrs.set(e.pointerId, pos(e));
    if (bpV.ptrs.size === 2) {
      const [a, b] = [...bpV.ptrs.values()];
      bpV.d0 = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      bpV.s0 = bpV.s;
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      bpV.ax = (mid.x - bpV.x) / bpV.s; bpV.ay = (mid.y - bpV.y) / bpV.s;
    }
  });
  stage.addEventListener("pointermove", e => {
    if (!bpV.ptrs.has(e.pointerId)) return;
    const p = pos(e), prev = bpV.ptrs.get(e.pointerId);
    bpV.ptrs.set(e.pointerId, p);
    if (bpV.ptrs.size === 1) {
      bpV.x += p.x - prev.x; bpV.y += p.y - prev.y;
      bpApply();
    } else if (bpV.ptrs.size === 2) {
      const [a, b] = [...bpV.ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      bpV.s = Math.min(bpV.maxS, Math.max(bpV.minS, bpV.s0 * d / bpV.d0));
      bpV.x = mid.x - bpV.ax * bpV.s; bpV.y = mid.y - bpV.ay * bpV.s;
      bpApply();
    }
  });
  const up = e => {
    const p = bpV.ptrs.get(e.pointerId);
    const wasSingle = bpV.ptrs.size === 1;

function buildYearlySchedule(planId) {
  if (rpSchedulesCache[planId]) return rpSchedulesCache[planId];
  let bookOrder = BIBLE_BOOKS.map(b => b.id);
  if (planId === "chronological") bookOrder = CHRONO_BOOK_ORDER;
  else if (planId === "writing") bookOrder = WRITING_BOOK_ORDER;
  else if (planId === "thematic") bookOrder = THEMATIC_BOOK_ORDER;
  const allCh = [];
  bookOrder.forEach(bId => {
    const b = getBook(bId);
    for (let c = 1; c <= b.ch; c++) {
      allCh.push({ bookId: b.id, abbr: b.abbr, name: b.name, ch: c });
    }
  });
  const total = allCh.length; // 1189 capitoli
  const days = [];
  for (let d = 0; d < 365; d++) {
    const startIdx = Math.floor((d * total) / 365);
    const endIdx = Math.floor(((d + 1) * total) / 365) - 1;
    const slice = allCh.slice(startIdx, endIdx + 1);
    const groups = [];
    slice.forEach(item => {
      const last = groups[groups.length - 1];
      if (last && last.bookId === item.bookId) {
        last.endCh = item.ch;
      } else {
        groups.push({ bookId: item.bookId, abbr: item.abbr, startCh: item.ch, endCh: item.ch });
      }
    });
    const label = groups.map(g => g.startCh === g.endCh ? `${g.abbr} ${g.startCh}` : `${g.abbr} ${g.startCh} - ${g.endCh}`).join("; ");
    days.push({
      dayNum: d + 1,
      label: label,
      firstBookId: slice[0].bookId,
      firstCh: slice[0].ch
    });
  }
  rpSchedulesCache[planId] = days;
  return days;
}

const BP_WORD = /[\p{L}\p{M}]+(?:[-ʽ][\p{L}\p{M}]+)*/gu;
const BP_PREP = new Set(["a","ad","da","di","in","presso","verso","fino","città","monte","paese","terra","valle","regione","deserto","nel","nella","dal","dalla","del","della","al","alla","sul","sulla","tra","fra"]);
const bpUi = { sel: [], all: [], scope: "", selLabel: "", byKey: new Map(), mapScore: new Map(), mapBest: 0 };
// Più luoghi del testo compaiono su una cartina, più quella cartina è consigliata
function bpComputeMapScore(results) {
  const score = new Map();
  results.forEach(r => {
    const maps = new Set();
    r.idxs.forEach(i => (bpMeta.places[i].r || []).forEach(x => maps.add(x.m)));
    maps.forEach(m => score.set(m, (score.get(m) || 0) + 1));
  });
  bpUi.mapScore = score;
  bpUi.mapBest = Math.max(0, ...score.values());
}

function bpKeyOf(txt) {
  return (String(txt || "").replace(/[\u2010\u2011]/g, "-").match(BP_WORD) || []).map(w => w.toLowerCase()).join(" ");
}

// ---------- Riconoscimento dei luoghi nel testo ----------
// Restituisce le occorrenze con posizione: { s, e, key, idxs }
function bpFindMatches(text) {
  const out = [];
  if (!bpMeta || !bpPlaceMap) return out;
  const t = String(text || "").replace(/[\u2010\u2011]/g, "-");
  const toks = [];
  BP_WORD.lastIndex = 0;
  let m;
  while ((m = BP_WORD.exec(t))) toks.push({ w: m[0], lw: m[0].toLowerCase(), s: m.index, e: m.index + m[0].length });
  const places = bpMeta.places;
  const gapOk = (a, b) => /^[\s’'‘ʼ]*$/.test(t.slice(toks[a].e, toks[b].s));
  for (let i = 0; i < toks.length;) {
    let hit = null, hitN = 0, key = "";
    if (/^\p{Lu}/u.test(toks[i].w)) {
      for (let n = Math.min(bpMaxKeyWords, toks.length - i); n >= 1; n--) {
        let ok = true;
        for (let j = i; j < i + n - 1; j++) if (!gapOk(j, j + 1)) { ok = false; break; }
        if (!ok) continue;
        const k = toks.slice(i, i + n).map(x => x.lw).join(" ");
        const idxs = bpPlaceMap.get(k);
        if (idxs) { hit = idxs; hitN = n; key = k; break; }
      }
    }
    if (hit) {
      let accept = true;
      if (hit.every(ix => places[ix].w)) {
        // nome ambiguo (Ai, Ur, Tema, Giuda...): vale solo dopo una preposizione o “città di”, mai a inizio frase
        accept = i > 0 && BP_PREP.has(toks[i - 1].lw) && /^[ \t\u00a0]+$/.test(t.slice(toks[i - 1].e, toks[i].s));
      }
      if (accept) out.push({ s: toks[i].s, e: toks[i + hitN - 1].e, key, idxs: hit });
      i += hitN;
    } else i++;
  }
  return out;
}
function bpScanText(text) {
  const t = String(text || "").replace(/[\u2010\u2011]/g, "-");
  const found = new Map();
  bpFindMatches(t).forEach(m => {
    const f = found.get(m.key);
    if (f) f.count++;
    else found.set(m.key, { key: m.key, surface: t.slice(m.s, m.e), idxs: m.idxs, count: 1, first: m.s });
  });
  return [...found.values()].sort((a, b) => a.first - b.first);
}

}

// ---------- Schede dei luoghi e rimandi alle cartine ----------
function bpGroupRefs(p) {
  const by = new Map();
  const add = (mapId, page, cell, alt) => {
    if (!by.has(mapId)) by.set(mapId, { mapId, pages: new Set(), cells: [], alt });
    const g = by.get(mapId);
    g.alt = g.alt && alt;
    if (page) g.pages.add(page);
    if (cell && !g.cells.includes(cell)) g.cells.push(cell);
  };
  (p.r || []).forEach(r => { add(r.m, r.p, r.g, false); (r.m2 || []).forEach(x => add(x, r.p, r.g, true)); });
  return [...by.values()]
    .map(g => ({ ...g, pages: [...g.pages].sort((a, b) => a - b) }))
    .sort((a, b) => (a.alt - b.alt) || ((bpUi.mapScore.get(b.mapId) || 0) - (bpUi.mapScore.get(a.mapId) || 0)) || (!!b.cells.length - !!a.cells.length) || a.mapId.localeCompare(b.mapId));
}
function bpRefButton(pi, gi, g) {
  const map = bpMapById(g.mapId);
  if (!map) return "";
  const star = (bpUi.mapBest >= 2 && (bpUi.mapScore.get(g.mapId) || 0) === bpUi.mapBest) ? "⭐ " : "";
  const cells = g.cells.length ? g.cells.join(", ") : (map.hasGrid ? "" : "senza griglia");
  return `<button class="bp-ref" onclick="bpOpen(${pi}, ${gi})">
    <span>🗺️ ${star}${escapeHtml(map.title)}${g.alt ? " <i>(alternativa)</i>" : ""}<span class="bp-sub"> · ${escapeHtml(bpPages(g.pages.length ? g.pages : map.pages))}</span></span>
    <b>${escapeHtml(cells)}</b></button>`;
}
function bpPlaceBlock(pi) {
  const p = bpMeta.places[pi];
  const groups = bpGroupRefs(p);
  const first = groups.slice(0, 4).map((g, gi) => bpRefButton(pi, gi, g)).join("");
  const rest = groups.slice(4).map((g, gi) => bpRefButton(pi, gi + 4, g)).join("");
  return `<div class="bp-place">
    <div class="bp-pname">${escapeHtml(p.n)}${p.see ? ` <span class="bp-sub">→ vedi ${escapeHtml(p.see)}</span>` : ""}</div>
    ${first}${rest ? `<details><summary class="bp-more">${groups.length - 4 === 1 ? "Un'altra cartina" : "Altre " + (groups.length - 4) + " cartine"}</summary>${rest}</details>` : ""}
  </div>`;
}
function bpCardHtml(r) {
  const cnt = r.count > 1 ? ` <span class="bp-cnt">×${r.count}</span>` : "";
  if (r.idxs.length === 1) {
    const p = bpMeta.places[r.idxs[0]];
    const same = bpKeyOf(p.n) === bpKeyOf(r.surface);
    return `<div class="bp-card"><div class="bp-title">📍 ${escapeHtml(r.surface)}${cnt}${same ? "" : ` <span class="bp-sub">(${escapeHtml(p.n)})</span>`}</div>${bpPlaceBlock(r.idxs[0])}</div>`;
  }
  return `<div class="bp-card"><div class="bp-title">📍 ${escapeHtml(r.surface)}${cnt} <span class="bp-sub">· ${r.idxs.length} luoghi con questo nome</span></div>${r.idxs.map(bpPlaceBlock).join("")}</div>`;
}
function bpSearchPlaces(q) {
  const qk = bpKeyOf(q);
  if (qk.length < 2 || !bpMeta) return [];
  const scored = [];
  (bpMeta.places || []).forEach((p, i) => {
    let best = 0;
    (p.k || []).forEach(k => {
      if (k === qk) best = Math.max(best, 4);
      else if (k.startsWith(qk)) best = Math.max(best, 3);
      else if (k.split(" ").some(w => w.startsWith(qk))) best = Math.max(best, 2);
      else if (k.includes(qk)) best = Math.max(best, 1);
    });
    if (best) scored.push([best, i]);
  });
  scored.sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  return scored.slice(0, 30).map(s => s[1]);
}
function bpOpen(pi, gi) {
  const g = bpGroupRefs(bpMeta.places[pi])[gi];
  if (g) {
    closeProModal();
    openMapViewer(g.mapId, g.cells, bpMeta.places[pi].n);
  }
}
// tocco su un nome evidenziato nel testo
function bpOpenSurface(key, surface) {
  const idxs = bpPlaceMap && bpPlaceMap.get(key);
  if (!idxs) return;
  if (idxs.length === 1) {
    const p = bpMeta.places[idxs[0]];
    const prim = bpGroupRefs(p).filter(g => !g.alt);
    if (prim.length === 1) { openMapViewer(prim[0].mapId, prim[0].cells, p.n); return; }
  }
  bpModalOpen("📍 " + surface, bpCardHtml({ surface, idxs, count: 1 }));
}

function bpClearHighlights() {
  const main = document.getElementById("mainContainer");
  if (!main) return;
  main.querySelectorAll("span.bm-place-hl").forEach(el => el.replaceWith(document.createTextNode(el.textContent || "")));
  main.normalize();
}
function bpHighlightDom() {
  const main = document.getElementById("mainContainer");
  if (!main || (currentViewContext && currentViewContext.type === "maps")) return;
  bpClearHighlights();
  const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      const p = node.parentElement;
      if (!p || p.closest("button, select, input, textarea, script, style, .tag-badge, .chapter-header, .section-title, .verse-num, .bm-place-hl")) return NodeFilter.FILTER_REJECT;
      return /\p{Lu}/u.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  let cur;
  while ((cur = walker.nextNode())) nodes.push(cur);
  nodes.forEach(tn => {
    const val = tn.nodeValue;
    const ms = bpFindMatches(val);
    if (!ms.length) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    ms.forEach(m => {
      if (m.s > last) frag.appendChild(document.createTextNode(val.slice(last, m.s)));
      const span = document.createElement("span");
      span.className = "bm-place-hl";
      span.textContent = val.slice(m.s, m.e);
      span.title = "📍 Tocca per aprire la cartina";
      span.onclick = ev => { ev.stopPropagation(); bpOpenSurface(m.key, span.textContent); };
      frag.appendChild(span);
      last = m.e;
    });
    if (last < val.length) frag.appendChild(document.createTextNode(val.slice(last)));
    tn.replaceWith(frag);
  });
}

function bpCitedRefs(text) {
  const html = formatNoteLinks(String(text || ""));

  const re = /jumpToRefString\('([^']*)'\)/g;

function openCustomSelectMenu(selectEl) {
  if (!selectEl || !selectEl.options || selectEl.options.length === 0) return;
  activeCustomSelectEl = selectEl;
  const modal = document.getElementById("bmSelectModal");
  const titleEl = document.getElementById("bmSelectModalTitle");
  const listEl = document.getElementById("bmSelectModalList");

  const titleMap = {
    trans1: "📖 Scegli Traduzione Principale",
    trans2: "⚖️ Scegli 2ª Traduzione Parallela",
    trans3: "⚖️ Scegli 3ª Traduzione Parallela",
    myReadBookSel: "🕯️ Scegli Libro Biblico",
    myReadChSel: "🕯️ Scegli Capitolo",
    searchBibleSelect: "🔍 Versione in cui Cercare",
    searchMode: "🔍 Modalità di Ricerca",
    searchScope: "🔍 Ambito dei Libri",
    catLangFilter: "🌍 Filtra per Lingua"
  };
  if (titleEl) {
    titleEl.textContent = titleMap[selectEl.id] || "🔹 Seleziona dal menù";
  }

  const opts = Array.from(selectEl.options);
  listEl.innerHTML = opts.map((opt, idx) => {
    const isSel = idx === selectEl.selectedIndex;
    return `<button type="button" class="bm-select-opt ${isSel ? 'selected' : ''}" id="bm_opt_${idx}" onclick="pickCustomSelectOption(${idx})">
      <span>${escapeHtml(opt.text)}</span>
      ${isSel ? '<span style="color:#00e5ff; font-weight:900;">✔</span>' : ''}
    </button>`;
  }).join("");

  setTimeout(() => {
    const curBtn = document.getElementById(`bm_opt_${selectEl.selectedIndex}`);
    if (curBtn) curBtn.scrollIntoView({ block: "center" });
  }, 40);
}

function pickCustomSelectOption(idx) {
  const sel = activeCustomSelectEl;
  closeBmSelectModal();
  if (!sel || !sel.options[idx]) return;
  if (sel.selectedIndex !== idx) {
    sel.selectedIndex = idx;
    sel.value = sel.options[idx].value;
    sel.dispatchEvent(new Event("change", { bubbles: true }));
  }
}

let lastCustomSelectOpenAt = 0;
let selectTouchStartPos = null;

document.addEventListener("touchstart", function(e) {
  const sel = e.target && e.target.closest ? e.target.closest("select") : null;
  if (sel && e.touches && e.touches[0]) {
    selectTouchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY, sel };
  } else {
    selectTouchStartPos = null;
  }
}, { passive: true, capture: true });

document.addEventListener("touchend", function(e) {
  if (!selectTouchStartPos) return;
  const t = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : null;
  const { x, y, sel } = selectTouchStartPos;
  selectTouchStartPos = null;
  if (t && Math.hypot(t.clientX - x, t.clientY - y) < 12) {
    e.preventDefault();
    e.stopPropagation();
    sel.blur();
    lastCustomSelectOpenAt = Date.now();
    openCustomSelectMenu(sel);
  }
}, { passive: false, capture: true });

["mousedown", "click"].forEach(evtName => {
  document.addEventListener(evtName, function(e) {
    const sel = e.target && e.target.closest ? e.target.closest("select") : null;
    if (!sel) return;
    e.preventDefault();
    e.stopPropagation();
    sel.blur();
    const now = Date.now();
    if (now - lastCustomSelectOpenAt > 300) {
      lastCustomSelectOpenAt = now;
      openCustomSelectMenu(sel);
    }
  }, { passive: false, capture: true });
});

document.addEventListener("keydown", function(e) {
  const sel = e.target && e.target.closest ? e.target.closest("select") : null;
  if (sel && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    openCustomSelectMenu(sel);
  }
}, true);

// 2. NAVIGAZIONE SWIPE ORIZZONTALE A UNA MANO (Bibbia, Giorno, Perspicacia, SI)
// ============================================================================
let bmSwipeStartX = 0;
let bmSwipeStartY = 0;
let bmSwipeStartTime = 0;
let bmSwipeIgnore = false;

document.getElementById("mainContainer")?.addEventListener("touchstart", function(e) {
  if (!e.touches || e.touches.length !== 1) { bmSwipeIgnore = true; return; }
  const t = e.target;
  if (t && t.closest("input, textarea, select, .quick-menu-bar, .verse-action-bar, .rp-scroll-window")) {
    bmSwipeIgnore = true;
    return;
  }
  const sel = window.getSelection ? window.getSelection() : null;
  if (sel && !sel.isCollapsed) { bmSwipeIgnore = true; return; }
  bmSwipeIgnore = false;
  bmSwipeStartX = e.touches[0].clientX;
  bmSwipeStartY = e.touches[0].clientY;
  bmSwipeStartTime = Date.now();
}, { passive: true });

document.getElementById("mainContainer")?.addEventListener("touchend", function(e) {
  if (bmSwipeIgnore || !e.changedTouches || e.changedTouches.length !== 1) return;
  const elapsed = Date.now() - bmSwipeStartTime;
  if (elapsed > 650) return;
  const dx = e.changedTouches[0].clientX - bmSwipeStartX;
  const dy = e.changedTouches[0].clientY - bmSwipeStartY;
  if (Math.abs(dx) < 88 || Math.abs(dy) > 38 || Math.abs(dx) < Math.abs(dy) * 2.4) return;
  const anyModalOpen = ["proModal", "noteModal", "myReadModal", "bmSelectModal", "mapsViewer"].some(id => {
    const el = document.getElementById(id);
    return el && el.style.display === "flex";
  });
  if (anyModalOpen) return;

  const isNext = dx < 0; // Swipe verso sinistra -> Successivo; Swipe verso destra -> Precedente
  if (currentViewContext.type === "bible") {
    if (isNext) nextChapter(); else prevChapter();
  } else if (currentViewContext.type === "daily") {
    showDailyTextView(currentDailyOffset + (isNext ? 1 : -1), true);
  } else if (currentViewContext.type === "insight" && typeof currentViewContext.idx === "number") {
    const total = insightMemCache?.entries?.length || 0;
    const nextIdx = currentViewContext.idx + (isNext ? 1 : -1);
    if (nextIdx >= 0 && nextIdx < total) showInsightView(nextIdx);
  } else if (currentViewContext.type === "si" && currentViewContext.mode === "reader") {
    const data = siMemCache;
    if (!data) return;
    const list = currentViewContext.kind === "x" ? siExtraItems(data) : data.books;
    const i = currentViewContext.i;
    const ci = currentViewContext.ci;
    const item = list[i];
    if (!item) return;
    if (isNext) {
      if (ci < item.chapters.length - 1) showSiReader(currentViewContext.kind, i, ci + 1);
      else if (i < list.length - 1) showSiReader(currentViewContext.kind, i + 1, 0);
    } else {
      if (ci > 0) showSiReader(currentViewContext.kind, i, ci - 1);
      else if (i > 0) showSiReader(currentViewContext.kind, i - 1, list[i - 1].chapters.length - 1);
    }
  }
}, { passive: true });

// 4. OMNISEARCH SUI 4 PILASTRI (Perspicacia, Tutta la Scrittura, Cartine, Bibbia)
// ============================================================================
async function executeOmniSearch() {
  const inpEl = document.getElementById("searchInput");
  const rawQuery = inpEl ? inpEl.value.trim() : "";
  const resDiv = document.getElementById("searchResults");
  if (!rawQuery || !resDiv) return;
  resDiv.innerHTML = `<div class="loader">🌐 Ricerca globale sui 4 Pilastri per "<b>${escapeHtml(rawQuery)}</b>" in corso...</div>`;
  await new Promise(r => setTimeout(r, 30));

  const qNorm = normalizeForSearch(rawQuery);
  let html = "";

  // 1. PERSPICACIA
  const insData = await getInsightData();
  if (insData && Array.isArray(insData.entries)) {
    const insHits = [];
    for (let i = 0; i < insData.entries.length; i++) {
      const e = insData.entries[i];
      const nTitle = normalizeForSearch(e.title);
      if (nTitle === qNorm || nTitle.startsWith(qNorm) || nTitle.includes(qNorm)) {
        insHits.push({ idx: i, entry: e, prio: nTitle === qNorm ? 1 : (nTitle.startsWith(qNorm) ? 2 : 3) });
      }
    }
    insHits.sort((a, b) => a.prio - b.prio || a.entry.title.length - b.entry.title.length);
    const topIns = insHits.slice(0, 6);
    html += `<div class="section-title"><span>📚 Perspicacia (${insHits.length} voci nel titolo)</span></div>`;
    if (topIns.length) {
      html += topIns.map(h => `
        <div class="result-card" onclick="insightSearchQuery='${escapeJsStr(rawQuery)}'; showInsightView(${h.idx})">
          <div class="result-ref">📘 ${escapeHtml(h.entry.title)}</div>
          <div style="font-size:13px; color:var(--text-muted);">${escapeHtml(h.entry.body.slice(0, 130).replace(/\s+/g, " "))}…</div>
        </div>
      `).join("");
    } else {
      html += `<div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Nessun titolo corrispondente. <span class="tag-badge" onclick="searchWordInInsight('${escapeJsStr(rawQuery)}')">Cerca nel testo di Perspicacia →</span></div>`;
    }
  }

  // 2. CARTINE BIBLICHE HD
  const mapsMeta = await bpGetMeta();
  if (mapsMeta) {
    const placeIdxs = bpSearchPlaces(rawQuery).slice(0, 5);
    html += `<div class="section-title"><span>🗺️ Cartine & Luoghi (${placeIdxs.length})</span></div>`;
    if (placeIdxs.length) {
      html += placeIdxs.map(pi => `<div class="bp-card">${bpPlaceBlock(pi)}</div>`).join("");
    } else {
      html += `<div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Nessun luogo geografico trovato.</div>`;
    }
  }

  // 3. TUTTA LA SCRITTURA
  const siData = await getSiData();
  if (siData && Array.isArray(siData.books)) {
    const siHits = [];
    siData.books.forEach((b, bi) => {
      const bTitle = siBookLabel(b);
      (b.chapters || []).forEach((c, ci) => {
        const hay = normalizeForSearch(`${bTitle} ${c.title} ${c.content}`);
        const pos = hay.indexOf(qNorm);
        if (pos !== -1) {
          siHits.push({ kind: "b", i: bi, ci, title: `${bTitle} — ${c.title}`, snippet: siSnippet(c.content, 130) });
        }
      });
    });
    const extras = siExtraItems(siData);
    extras.forEach((x, xi) => {
      const c = x.chapters[0];
      if (c && normalizeForSearch(`${x.title} ${c.content}`).includes(qNorm)) {
        siHits.push({ kind: "x", i: xi, ci: 0, title: x.title, snippet: siSnippet(c.content, 130) });
      }
    });
    html += `<div class="section-title"><span>📘 Tutta la Scrittura (${siHits.length} sezioni)</span></div>`;
    if (siHits.length) {
      html += siHits.slice(0, 5).map(h => `
        <div class="result-card" onclick="showSiReader('${h.kind}', ${h.i}, ${h.ci})">
          <div class="result-ref">📘 ${escapeHtml(h.title)}</div>
          <div style="font-size:13px; color:var(--text-muted);">${escapeHtml(h.snippet)}</div>
        </div>
      `).join("");
    } else {
      html += `<div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Nessuna occorrenza in Tutta la Scrittura.</div>`;
    }
  }

  // 4. RIMANDO IMMEDIATO CONCORDANZA BIBLICA
  html += `
    <div class="section-title"><span>📖 Concordanza Biblica</span></div>
    <button class="search-btn" style="width:100%; padding:12px;" onclick="executeSearch(1)">
      🔍 Mostra tutti i versetti biblici con "${escapeHtml(rawQuery)}"
    </button>
  `;

  resDiv.innerHTML = html;
}

(function initEnterpriseNativeFeel() {
  try {
    window.history.replaceState({ bmGuard: true }, "");
    window.history.pushState({ bmGuard: true }, "");
  } catch (e) {}

  window.addEventListener("popstate", function () {
    const closeIfFlex = (id, fn) => {
      const el = document.getElementById(id);
      if (el && el.style.display === "flex") {
        if (fn) fn(); else el.style.display = "none";
        return true;
      }
      return false;
    };

    const handledModal =
      closeIfFlex("bmSelectModal", closeBmSelectModal) ||
      closeIfFlex("myReadModal") ||
      closeIfFlex("noteModal", closeNoteModal) ||
      closeIfFlex("proModal", closeProModal) ||
      closeIfFlex("mapsViewer", closeMapViewer) ||
      closeIfFlex("verseActionBar", closeActionBar);

    if (handledModal) {
      bmHaptic(10);
      try { window.history.pushState({ bmGuard: true }, ""); } catch (e) {}
      return;
    }

    if (navHistory.length > 0) {
      bmHaptic(12);
      goBackHistory();
      try { window.history.pushState({ bmGuard: true }, ""); } catch (e) {}
    }
  });

  const mainEl = document.getElementById("mainContainer");
  if (mainEl && typeof MutationObserver !== "undefined") {
    let lastAnimAt = 0;
    const obs = new MutationObserver(() => {
      const now = Date.now();
      if (now - lastAnimAt < 90) return;
      lastAnimAt = now;
      mainEl.classList.remove("bm-view-anim");
      void mainEl.offsetWidth;
      mainEl.classList.add("bm-view-anim");
    });
    obs.observe(mainEl, { childList: true });
  }
