// DATABASE LOCALE INDEXEDDB PER SALVARE INTERE BIBBIE OFFLINE
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("BibleStudioOfflineDB", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("bibles");
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
}
async function getOfflineBible(id) {
  try {
    const db = await openDB();
    return new Promise(res => {
      const tx = db.transaction("bibles", "readonly");
      const req = tx.objectStore("bibles").get(id);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => res(null);
    });
  } catch(e) { return null; }
}
async function saveOfflineBible(id, data) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("bibles", "readwrite");
    tx.objectStore("bibles").put(data, id);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e);
  });
}

function populateSelects() {
  const all = [...DEFAULT_TRANSLATIONS, ...state.customTrans];
  const s1 = document.getElementById("trans1");
  const s2 = document.getElementById("trans2");
  const html = all.map(t => `<option value="${t.id}">${t.name}</option>`).join("");
  s1.innerHTML = html;
  s2.innerHTML = html;
  s1.value = state.trans1;
  s2.value = state.trans2;
}

function setActiveTab(tabId) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  const el = document.getElementById(tabId);
  if (el) el.classList.add("active");
}

function getBook(id) {
  return BIBLE_BOOKS.find(b => b.id === id) || BIBLE_BOOKS[0];
