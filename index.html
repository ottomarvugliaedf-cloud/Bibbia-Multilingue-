    showBlueInfoModal("⚠️ Libreria Mancante", "Libreria JSZip non caricata. Verifica la connessione internet.");
    return;
  }
  try {
    const existingBible = await getOfflineBible(targetId);
    const mergedBooksMap = new Map();
    if (existingBible && Array.isArray(existingBible.books)) {
      existingBible.books.forEach(b => {
        if (b && b.chapters && b.chapters.length > 0) {
          mergedBooksMap.set(Number(b.nr), b);
        }
      });
    }
    for (const file of files) {
      statusEl.innerHTML = `⏳ Analisi di <b>${escapeHtml(file.name)}</b> in corso...`;
      const zip = await JSZip.loadAsync(file);
      const allFiles = Object.keys(zip.files);
      const isJwEpub = targetId.startsWith("gb:nwt") || targetId.startsWith("gb:bi12") ||
      allFiles.some(f => /_BI12_\.|\.GE-split|biblechapternav/i.test(f));
      if (!isJwEpub) {
        await extractCalibreSplitEpub(zip, allFiles, mergedBooksMap, statusEl, labelName);
      } else {
        await extractJwFormatEpub(zip, allFiles, mergedBooksMap, statusEl, labelName);
      }
    }
    const finalBooksData = [];
    let importedCount = 0;
    for (let bId = 1; bId <= 66; bId++) {
      const bMeta = getBook(bId);
      const existing = mergedBooksMap.get(bId);
      if (existing && existing.chapters && existing.chapters.length > 0) {
        importedCount++;
        finalBooksData.push(existing);
      } else {
        finalBooksData.push({ nr: bId, name: bMeta.name, chapters: [] });
      }
    }
    statusEl.innerHTML = `💾 Salvataggio permanente nel database Offline...`;
    const fullBibleObj = { id: targetId, name: labelName, books: finalBooksData };
    await saveOfflineBible(targetId, fullBibleObj);
    if (!state.downloadedBibles.includes(targetId)) {
      state.downloadedBibles.unshift(targetId);
      safeSaveStorage("bm_v10_pro_bibles", JSON.stringify(state.downloadedBibles));
    }
    await populateSelects();
    state.trans1 = targetId;
    document.getElementById("trans1").value = targetId;
    safeSaveStorage("bm_trans1", targetId);
    statusEl.innerHTML = `✔ <b>${escapeHtml(labelName)}</b> salvata Offline (${importedCount}/66 libri pronti)!`;
    setTimeout(() => {
      closeProModal();
      loadChapterView();
    }, 1000);
  } catch (err) {
    console.error(err);
    statusEl.innerHTML = `❌ Errore durante l'importazione: ${escapeHtml(err.message)}`;
  }
}

async function extractJwFormatEpub(zip, allFiles, mergedBooksMap, statusEl, labelName) {
  const JW_BOOK_CODES = ["", "GE", "EX", "LE", "NU", "DE", "JOS", "JG", "RU", "1SA", "2SA", "1KI", "2KI", "1CH", "2CH", "EZR", "NE", "ES", "JOB", "PS", "PR", "EC", "CA", "ISA", "JER", "LA", "EZE", "DA", "HOS", "JOE", "AM", "OB", "JON", "MIC", "NAH", "HAB", "ZEP", "HAG", "ZEC", "MAL", "MT", "MR", "LU", "JOH", "AC", "RO", "1CO", "2CO", "GA", "EPH", "PHP", "COL", "1TH", "2TH", "1TI", "2TI", "TIT", "PHM", "HEB", "JAS", "1PE", "2PE", "1JO", "2JO", "3JO", "JUD", "RE"];

  // Mappa universale automatica per tutte le edizioni NWT moderne (IT, EN, ES, PT) tramite biblechapternav1..66.xhtml
  const navBookPrefixMap = {};
  for (let bId = 1; bId <= 66; bId++) {
    const navFile = allFiles.find(f => f.split("/").pop().toLowerCase() === `biblechapternav${bId}.xhtml`);
    if (navFile) {
      try {
        const navHtml = await zip.files[navFile].async("string");
        const m = navHtml.match(/href=["']([^"']+?)\.xhtml["']/i);
        if (m && m[1]) {
          navBookPrefixMap[bId] = m[1].split("/").pop().replace(/-split\d+$/i, "");
        }
      } catch (e) { console.debug(e); }
    }
  }

  for (let bId = 1; bId <= 66; bId++) {
    const prefixNum = String(bId + 4).padStart(2, "0"); // 05..70 per tutte le edizioni bi12 (1984/1987) in qualsiasi lingua
    const jwCode = JW_BOOK_CODES[bId];
    const bookMeta = getBook(bId);
    statusEl.innerHTML = `⚙️ Estrazione <b>${escapeHtml(labelName)}</b>: ${escapeHtml(bookMeta.name)} (${bId}/66)...`;

    const navPrefix = navBookPrefixMap[bId] || null;

    let bookFiles = allFiles.filter(f => {
      const base = f.split("/").pop();
      if ((!base.endsWith(".xhtml") && !base.endsWith(".html")) || base.includes("extracted") || base.includes("outline") || base.startsWith("BIBLE_") || base.startsWith("bible")) return false;

      // 1. Serie moderna NWT (usa il prefisso esatto letto da biblechapternavX.xhtml, es. 1001060402 o 1001061105)
      if (navPrefix && (base === `${navPrefix}.xhtml` || base.startsWith(`${navPrefix}-split`))) {
        return true;
      }
      // 2. Serie storica BI12 (1984/1987): i 66 libri iniziano sempre con 05_BI12_ .. 70_BI12_ indipendentemente dalla lingua
      if (base.startsWith(prefixNum + "_")) {
        return true;
      }
      // 3. Fallback su sigla libro
      const matchNwtCode = new RegExp(`[_. ]${jwCode}(?:-split\\d+)?\\.x?html$`, "i").test(base);
      return matchNwtCode;
    });

    if (bookFiles.length === 0) {
      const nwtDocNum = String(1001061104 + bId);
      bookFiles = allFiles.filter(f => {
        const base = f.split("/").pop();
        return base.startsWith(nwtDocNum) && (base.endsWith(".xhtml") || base.endsWith(".html")) && !base.includes("extracted") && !base.includes("outline");
      });
    }

    const chaptersArr = [];
    for (const fPath of bookFiles) {
      const base = fPath.split("/").pop();
      let chNum = 1;
      const splitMatch = base.match(/-split(\d+)\.x?html$/i);
      if (splitMatch) chNum = parseInt(splitMatch[1], 10);
      const rawXhtml = await zip.files[fPath].async("string");
      const versesArr = parseJwEpubChapterXhtml(rawXhtml);
      if (versesArr.length > 0) {
        chaptersArr.push({ chapter: chNum, verses: versesArr });
      }
    }
    if (chaptersArr.length > 0) {
      chaptersArr.sort((a, b) => a.chapter - b.chapter);
      mergedBooksMap.set(bId, { nr: bId, name: bookMeta.name, chapters: chaptersArr });
    }
  }
}

function parseJwEpubChapterXhtml(xhtml) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xhtml, "text/html");
  // Rimuove note a piè di pagina, riferimenti marginali, intestazioni e link di rimando
  doc.querySelectorAll(".footnote, .footnotes, .groupFootnote, .marginal, a.b, a.fn, rt, sup.xrefLink, .du-color--textSubdued").forEach(el => el.remove());

  const body = doc.body || doc.documentElement;
  if (!body) return [];

  // Metodo 1: Span con id="chapterX_verseY" o id="vX_Y" (usato in nwt_I.epub e bi12_I.epub)
  const verseSpans = body.querySelectorAll('span[id*="verse"], span[id^="v"], a[id*="verse"]');
  if (verseSpans.length > 0) {
    // Inserisce marcatori testuali univoci prima di estrarre il textContent
    verseSpans.forEach(sp => {
      const idVal = sp.getAttribute("id") || "";
      const m = idVal.match(/verse(\d+)$/i) || idVal.match(/^v\d+_(\d+)$/i) || idVal.match(/(\d+)$/);
      if (m) {
        const vNum = parseInt(m[1], 10);
        const marker = doc.createTextNode(` %%%VERSE_${vNum}%%% `);
        sp.parentNode.insertBefore(marker, sp);
      }
    });
    // Rimuove il numero grande del capitolo (w_ch) dopo aver piazzato i marker dei versetti
    body.querySelectorAll(".w_ch, strong.w_ch, sup").forEach(el => el.remove());

    const fullText = body.textContent || "";
    const parts = fullText.split(/%%%VERSE_(\d+)%%%/);
    if (parts.length > 1) {
      const versesMap = new Map();
      for (let i = 1; i < parts.length; i += 2) {
        const vNum = parseInt(parts[i], 10);
        let cleanTxt = (parts[i + 1] || "")
          .replace(/^[\s\d\u00A0.,;:]+/, "")
          .replace(/[\+\*]/g, "")
          .replace(/\s+/g, " ")
          .trim();
        if (vNum > 0 && cleanTxt) {
          const prev = versesMap.get(vNum);
          versesMap.set(vNum, prev ? (prev + " " + cleanTxt) : cleanTxt);
        }
      }
      const result = Array.from(versesMap.entries())
        .map(([verse, text]) => ({ verse, text }))
        .sort((a, b) => a.verse - b.verse);
      if (result.length > 0) return result;
    }
  }

  // Metodo 2 (Fallback universale per bi12 / TNM 1987 se i versetti sono marcati tramite <strong>w_ch</strong> e <sup>/<strong>)
  body.querySelectorAll(".w_ch, strong.w_ch").forEach(chEl => {
    const m1 = doc.createTextNode(" %%%VERSE_1%%% ");
    chEl.parentNode.insertBefore(m1, chEl);
    chEl.remove();
  });
  body.querySelectorAll("sup, span.v, strong.v").forEach(supEl => {
    const numTxt = (supEl.textContent || "").trim();
    if (/^\d{1,3}$/.test(numTxt)) {
      const mv = doc.createTextNode(` %%%VERSE_${numTxt}%%% `);
      supEl.parentNode.insertBefore(mv, supEl);
      supEl.remove();
    }
  });
  const fallbackText = body.textContent || "";
  const fbParts = fallbackText.split(/%%%VERSE_(\d+)%%%/);
  const fbVerses = [];
  for (let i = 1; i < fbParts.length; i += 2) {
    const vNum = parseInt(fbParts[i], 10);
    let cleanTxt = (fbParts[i + 1] || "")
      .replace(/^[\s\d\u00A0]+/, "")
      .replace(/[\+\*]/g, "")
      .replace(/\s+/g, " ")
      .trim();
    if (vNum > 0 && cleanTxt) {
      fbVerses.push({ verse: vNum, text: cleanTxt });
    }
  }
  return fbVerses;
}
  async function extractCalibreSplitEpub(zip, allFiles, mergedBooksMap, statusEl, labelName) {
  const tocFile = allFiles.find(f => f.endsWith("toc.ncx"));
  const opfFile = allFiles.find(f => f.endsWith("content.opf"));
  let orderedHtmlFiles = allFiles
    .filter(f => (f.endsWith(".html") || f.endsWith(".xhtml")) && !f.includes("titlepage"))
    .sort();
  if (opfFile) {
    try {
      const opfTxt = await zip.files[opfFile].async("string");
      const parser = new DOMParser();
      const opfDoc = parser.parseFromString(opfTxt, "text/xml");
      const manifestMap = {};
      opfDoc.querySelectorAll("manifest > item").forEach(it => {
        manifestMap[it.getAttribute("id")] = it.getAttribute("href");
      });
      const spineOrder = [];
      opfDoc.querySelectorAll("spine > itemref").forEach(ref => {
        const href = manifestMap[ref.getAttribute("idref")];
        if (href && zip.files[href] && !href.includes("titlepage")) spineOrder.push(href);
      });
      if (spineOrder.length > 0) orderedHtmlFiles = spineOrder;
    } catch (e) { console.debug(e); }
  }

  const anchorMarkers = new Map();
  if (tocFile) {
    const tocTxt = await zip.files[tocFile].async("string");
    const parser = new DOMParser();
    const tocDoc = parser.parseFromString(tocTxt, "text/xml");
    let currentBookId = null;

    tocDoc.querySelectorAll("navPoint").forEach(np => {
      const labelEl = np.querySelector("navLabel > text");
      const contentEl = np.querySelector("content");
      if (!labelEl || !contentEl) return;
      const label = (labelEl.textContent || "").replace(/\s+/g, " ").trim();
      const src = decodeURIComponent((contentEl.getAttribute("src") || "").trim());
      if (!src) return;

      // Se l'ancora contiene già #bm_book_X (come nei file NR preparati da Claude), estrae direttamente il numero del libro!
      const bmBookMatch = src.match(/#bm_book_(\d+)$/i);
      if (bmBookMatch) {
        currentBookId = parseInt(bmBookMatch[1], 10);
        anchorMarkers.set(src, { bookId: currentBookId, chapter: 1 });
        return;
      }

      const chMatch = label.match(/^(?:capitolo|cap\.?|salmo)\s*(\d{1,3})\.?$|^(\d{1,3})\.?$/i);
      if (chMatch) {
        if (currentBookId && currentBookId > 0) {
          const chNum = parseInt(chMatch[1] || chMatch[2], 10);
          anchorMarkers.set(src, { bookId: currentBookId, chapter: chNum });
        }
        return;
      }

      const matchedBId = matchItalianBookNameToId(label, false);
      const bookAndChMatch = label.match(/^(.+?)\s+(\d{1,3})\.?$/);
      if (matchedBId === -1) {
        currentBookId = null;
        anchorMarkers.set(src, { bookId: -1, chapter: 1 });
      } else if (matchedBId && matchedBId > 0) {
        currentBookId = matchedBId;
        const chFromLabel = bookAndChMatch ? parseInt(bookAndChMatch[2], 10) : 1;
        if (!anchorMarkers.has(src)) {
          anchorMarkers.set(src, { bookId: currentBookId, chapter: chFromLabel });
        }
      }
    });
  }

  let activeBookId = null;
  let activeChapter = 1;
  let activeVersesMap = new Map();

  const flushCurrentChapter = () => {
    if (!activeBookId || activeBookId < 1 || activeVersesMap.size === 0) {
      activeVersesMap = new Map();
      return;
    }
    const bookMeta = getBook(activeBookId);
    if (!mergedBooksMap.has(activeBookId)) {
      mergedBooksMap.set(activeBookId, { nr: activeBookId, name: bookMeta.name, chapters: [] });
    }
    const bObj = mergedBooksMap.get(activeBookId);
    const versesArr = Array.from(activeVersesMap.entries())
      .map(([verse, text]) => ({ verse, text: text.replace(/\s+/g, " ").trim() }))
      .filter(v => v.text.length > 0)
      .sort((a, b) => a.verse - b.verse);
    if (versesArr.length > 0) {
      const existingChIdx = bObj.chapters.findIndex(c => Number(c.chapter) === Number(activeChapter));
      if (existingChIdx > -1) {
        if (versesArr.length >= bObj.chapters[existingChIdx].verses.length) {
          bObj.chapters[existingChIdx].verses = versesArr;
        }
      } else {
        bObj.chapters.push({ chapter: activeChapter, verses: versesArr });
        bObj.chapters.sort((a, b) => a.chapter - b.chapter);
      }
    }
    activeVersesMap = new Map();
  };

  for (let fIdx = 0; fIdx < orderedHtmlFiles.length; fIdx++) {
    const fPath = orderedHtmlFiles[fIdx];
    const fBase = fPath.split("/").pop();
    statusEl.innerHTML = `⚙️ Lettura <b>${escapeHtml(labelName)}</b> (${fIdx + 1}/${orderedHtmlFiles.length})...`;

    if (anchorMarkers.has(fPath) || anchorMarkers.has(fBase)) {
      flushCurrentChapter();
      const mk = anchorMarkers.get(fPath) || anchorMarkers.get(fBase);
      activeBookId = mk.bookId > 0 ? mk.bookId : null;
      activeChapter = mk.chapter || 1;
    }

    const rawHtml = await zip.files[fPath].async("string");
    const parser = new DOMParser();
    const doc = parser.parseFromString(rawHtml, "text/html");
    const body = doc.body || doc.documentElement;
    if (!body) continue;

    body.querySelectorAll('a[href*="index_split_000"], a[href*="index_split_001"], .footnote, .footnotes').forEach(a => {
      if (/^(?:indice|sommario|\[)/i.test((a.textContent || "").trim())) {
        if (!a.getAttribute("id")) a.remove();
      }
    });

    // 1. Fonde i tag <sup> adiacenti tipici della CEI 2008 (es. <sup>1</sup><sup>7</sup> -> <sup>17</sup>)
    body.querySelectorAll("sup").forEach(sp => {
      if (!sp.parentNode) return;
      let next = sp.nextSibling;
      while (next && next.nodeType === 1 && next.tagName.toLowerCase() === "sup") {
        sp.textContent = (sp.textContent || "").trim() + (next.textContent || "").trim();
        const toRem = next;
        next = next.nextSibling;
        toRem.remove();
      }
    });

    // 2. Trasforma ogni <sup> numerico di versetto direttamente nel token " %%%V_num%%% " (risolve l'assenza di spazio in CEI 2008!)
    body.querySelectorAll("sup, span.num, span.v, span.versetto").forEach(sp => {
      const t = (sp.textContent || "").trim().replace(/\.$/, "");
      if (/^\d{1,3}$/.test(t)) {
        sp.textContent = ` %%%V_${t}%%% `;
      }
    });

    // 3. Inietta i marker di cambio libro/capitolo (supporta anche <div id="bm_book_X"></div> vuoto!)
    body.querySelectorAll("[id]").forEach(el => {
      const idAttr = el.getAttribute("id");
      if (!idAttr) return;
      let mk = anchorMarkers.get(`${fPath}#${idAttr}`) || anchorMarkers.get(`${fBase}#${idAttr}`);
      const bmDirect = idAttr.match(/^bm_book_(\d+)$/i);
      if (bmDirect) {
        mk = { bookId: parseInt(bmDirect[1], 10), chapter: 1 };
      }
      if (mk) {
        const markerP = doc.createElement("p");
        markerP.textContent = `%%%ANCHOR_${mk.bookId || -1}_${mk.chapter || 1}%%%`;
        el.parentNode.insertBefore(markerP, el);
      }
    });

    // 4. Scansiona tutti i blocchi testuali (incluso <blockquote> usato nei poetici di NR!)
    const blocks = body.querySelectorAll("h1, h2, h3, h4, h5, h6, p, blockquote, div");
    blocks.forEach(el => {
      const tag = el.tagName.toLowerCase();
      if (tag === "div" && el.querySelector("p, h1, h2, h3, h4, blockquote, div")) return;

      const rawBlockText = (el.textContent || "").replace(/\s+/g, " ").trim();
      if (!rawBlockText) return;

      const anchorParts = rawBlockText.split(/%%%ANCHOR_(-?\d+)_(\d+)%%%/);
      for (let aIdx = 0; aIdx < anchorParts.length; aIdx += 3) {
        if (aIdx > 0) {
          const newBId = parseInt(anchorParts[aIdx - 2], 10);
          const newCh = parseInt(anchorParts[aIdx - 1], 10);
          flushCurrentChapter();
          activeBookId = newBId > 0 ? newBId : null;
          activeChapter = newCh > 0 ? newCh : 1;
        }

        let txt = (anchorParts[aIdx] || "").trim();
        if (!txt) continue;

        if (tag.startsWith("h") || (!txt.includes("%%%V_") && txt.length < 32)) {
          const chOnly = txt.match(/^(?:capitolo|cap\.?|salmo)\s*(\d{1,3})\.?$|^(\d{1,3})\.?$/i);
          if (chOnly && activeBookId) {
            const parsedCh = parseInt(chOnly[1] || chOnly[2], 10);
            if (parsedCh > 0 && parsedCh <= 150 && parsedCh !== activeChapter) {
              flushCurrentChapter();
              activeChapter = parsedCh;
            }
            continue;
          }
          if (tag.startsWith("h")) {
            const maybeBId = matchItalianBookNameToId(txt, true);
            if (maybeBId === -1) {
              flushCurrentChapter();
              activeBookId = null;
              continue;
            } else if (maybeBId && maybeBId > 0 && maybeBId !== activeBookId) {
              flushCurrentChapter();
              activeBookId = maybeBId;
              const inlineCh = txt.match(/\s+(\d{1,3})\.?$/);
              activeChapter = inlineCh ? parseInt(inlineCh[1], 10) : 1;
              continue;
            }
          }
        }

        if (!activeBookId || activeBookId < 1) continue;

        const normalizedTxt = txt.replace(/(?:^|\s)(\d{1,3})\.\s*(?=[A-Za-zÀ-ÿ«"“'‘(—–-])/g, " %%%V_$1%%% ");
        if (normalizedTxt.includes("%%%V_")) {
          const vParts = normalizedTxt.split(/%%%V_(\d{1,3})%%%/);
          const leadingTxt = (vParts[0] || "").trim();
          if (leadingTxt && activeVersesMap.size > 0) {
            const lastKey = Array.from(activeVersesMap.keys()).pop();
            activeVersesMap.set(lastKey, activeVersesMap.get(lastKey) + " " + leadingTxt);
          }
          for (let vIdx = 1; vIdx < vParts.length; vIdx += 2) {
            const vNum = parseInt(vParts[vIdx], 10);
            const vText = (vParts[vIdx + 1] || "").trim();
            if (vNum > 0 && vNum <= 176 && vText.length > 0) {
              const prev = activeVersesMap.get(vNum);
              activeVersesMap.set(vNum, prev ? (prev + " " + vText) : vText);
            }
          }
        } else {
          const noDotMatch = txt.match(/^(\d{1,3})\s+([A-Za-zÀ-ÿ«"“'‘(—–-].*)$/);
          if (noDotMatch) {
            const vNum = parseInt(noDotMatch[1], 10);
            const vText = noDotMatch[2].trim();
            if (vNum > 0 && vNum <= 176 && vText.length > 0) {
              const prev = activeVersesMap.get(vNum);
              activeVersesMap.set(vNum, prev ? (prev + " " + vText) : vText);
            }
          } else if (activeVersesMap.size > 0) {
            const lastKey = Array.from(activeVersesMap.keys()).pop();
            if (lastKey && txt.length > 1 && !/^(?:capitolo|nota|sommario|indice)/i.test(txt)) {
              activeVersesMap.set(lastKey, activeVersesMap.get(lastKey) + " " + txt);
            }
          }
        }
      }
    });
  }
  flushCurrentChapter();
}

let currentDailyOffset = 0;

async function importDailyTextEpub(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const statusEl = getActiveEpubStatusEl();
  if (typeof JSZip === "undefined") {
    showBlueInfoModal("⚠️ Libreria Mancante", "Libreria JSZip non caricata. Verifica la connessione internet.");
    return;
  }
  try {
    statusEl.innerHTML = `⏳ Estrazione dei 365 giorni da <b>${escapeHtml(file.name)}</b>...`;
    const zip = await JSZip.loadAsync(file);
    const allFiles = Object.keys(zip.files);

    // Individua i file principali dei 12 mesi (es. 1102027200.xhtml .. 1102027211.xhtml)
    // che hanno almeno un corrispondente -split15.xhtml e NON contengono "-extracted"
    const monthBasePrefixes = [];
    allFiles.forEach(f => {
      const m = f.match(/^(.*\/(\d+))-split15\.x?html$/i);
      if (m && !f.includes("-extracted")) {
        monthBasePrefixes.push(m[1]);
      }
    });
    monthBasePrefixes.sort();

    if (monthBasePrefixes.length < 12) {
      throw new Error("Struttura mensile non trovata nel file EPUB selezionato.");
    }

    const dailyMap = {};
    const parser = new DOMParser();

    for (let mIdx = 0; mIdx < 12; mIdx++) {
      const monthNum = mIdx + 1;
      const basePrefix = monthBasePrefixes[mIdx];
      statusEl.innerHTML = `⏳ Estrazione mese ${monthNum}/12...`;

      for (let dayNum = 1; dayNum <= 31; dayNum++) {
        const candidatePath = dayNum === 1
          ? `${basePrefix}.xhtml`
          : `${basePrefix}-split${dayNum}.xhtml`;
        const zipEntry = zip.files[candidatePath];
        if (!zipEntry) continue;

        const rawXhtml = await zipEntry.async("string");
        const doc = parser.parseFromString(rawXhtml, "text/html");
        doc.querySelectorAll("script, style, rt, .footnote").forEach(el => el.remove());

        const body = doc.body || doc.documentElement;
        if (!body) continue;

        const hEl = body.querySelector("h1, h2, header h2");
        const themeEl = body.querySelector(".themeScrp, p.themeScrp, em");
        const commentEls = body.querySelectorAll(".bodyTxt p, p.sb, p");

        const dateTitle = hEl ? hEl.textContent.replace(/\s+/g, " ").trim() : `${dayNum}/${monthNum}`;
        let themeScripture = themeEl ? themeEl.textContent.replace(/\s+/g, " ").trim() : "";

        const paragraphs = [];
        commentEls.forEach(p => {
          const txt = p.textContent.replace(/\s+/g, " ").trim();
          if (!txt || txt === dateTitle || txt === themeScripture) return;
          if (!themeScripture && paragraphs.length === 0) {
            themeScripture = txt;
          } else {
            paragraphs.push(txt);
          }
        });

        const key = `${String(monthNum).padStart(2, "0")}-${String(dayNum).padStart(2, "0")}`;
        dailyMap[key] = {
          dateTitle,
          theme: themeScripture,
          comment: paragraphs.join("\n\n")
        };
      }
    }

    await saveOfflineBible("bm:daily_text", { updated: Date.now(), days: dailyMap });
    statusEl.innerHTML = `✔ Scrittura del Giorno salvata offline con successo!`;
    setTimeout(() => {
      closeProModal();
      showDailyTextView(0);

// ============================================================================
// MODULO PERSPICACIA NELLO STUDIO DELLE SCRITTURE (it_I ZIP/RTF & EPUB)
// ============================================================================
let insightMemCache = null;
let insightActiveLetter = "TUTTE";
let insightSearchQuery = "";
let searchTimeout = null;
let currentHitIdx = 0;

function parseRtfToCleanText(rtfRaw) {
  if (!rtfRaw) return "";
  let s = rtfRaw
    .replace(/\\(?:par|pard|sect|page|line|row)\b[ \t]*/gi, "\n")
    .replace(/\\\r?\n/g, "\n")
    .replace(/\\tab\b[ \t]*/gi, " ");
  s = s.replace(/\{\\(?:fonttbl|colortbl|stylesheet|info|pict|object|header|footer|\*\\)[^{}]*(?:\{[^{}]*\}[^{}]*)*\}/gi, "");
  s = s.replace(/\\'[0-9a-fA-F]{2}/g, m => {
    const code = parseInt(m.slice(2), 16);
    try { return new TextDecoder("windows-1252").decode(new Uint8Array([code])); }
    catch (e) { console.debug(e); return String.fromCharCode(code); }
  });
  s = s.replace(/\\u(-?\d+)\??/g, (_, d) => {
    let c = parseInt(d, 10);
    if (c < 0) c += 65536;
    return String.fromCharCode(c);
  });
  s = s.replace(/\\[a-zA-Z]+-?\d*[ \t]?/g, "");
  s = s.replace(/\\['\+\*\~\-_\\/]/g, "");
  s = s.replace(/[{}]/g, "");
  return s.replace(/\r/g, "").replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
}

function splitCleanTextIntoEntries(rawText, entriesArray) {
  const lines = rawText.split("\n").map(l => l.trim()).filter(Boolean);
  let curTitle = "";
  let curBody = [];
  const flush = () => {
    if (curTitle && curBody.length > 0) {
      const bodyStr = curBody.join("\n\n").trim();
      if (bodyStr.length > 10) {
        const firstChar = curTitle.normalize("NFD").replace(/[\u0300-\u036f]/g, "").charAt(0).toUpperCase();
        const letter = /[A-Z]/.test(firstChar) ? firstChar : "#";
        entriesArray.push({ title: curTitle, letter, body: bodyStr });
      }
    }
    curTitle = "";
    curBody = [];
  };

  for (const line of lines) {
    const headCandidate = line.replace(/\s*[\(\[][^)\]]*[\)\]]\s*$/, "").trim();
    const isAllCapsHeading = headCandidate.length >= 2 && headCandidate.length <= 75 &&
      headCandidate === headCandidate.toUpperCase() &&
      /[A-ZÀ-Ý]/.test(headCandidate) &&
      !/^\d/.test(headCandidate) &&
      !/[.;:!?]$/.test(headCandidate);

    if (isAllCapsHeading) {
      flush();
      curTitle = headCandidate;
      const extraPron = line.slice(headCandidate.length).trim();
      if (extraPron) curBody.push(extraPron);
      continue;
    }

    const inlineMatch = line.match(/^([A-ZÀ-Ý][A-ZÀ-Ý0-9\s,'’-]{1,50}?)(?:\s+(\([A-ZÀ-ÿa-z0-9\s,'’-]+\)|\b(?:I|II|III|IV|V|VI|VII|VIII|IX|X)\b))?\s+(\[.*|\(.*|[A-ZÀ-Ý][a-zà-ÿ].*)$/);
    if (inlineMatch) {
      const capPart = inlineMatch[1].trim();
      const romOrPron = (inlineMatch[2] || "").trim();
      const restBody = inlineMatch[3].trim();
      if (capPart === capPart.toUpperCase() && capPart.length >= 2 && !/^(?:NOTA|VEDI|CAPITOLO|PARTE|TABELLA|CARTINA|ILLUSTRAZIONE)\b/.test(capPart)) {
        flush();
        curTitle = romOrPron && /^[IVX]+$/.test(romOrPron) ? `${capPart}, ${romOrPron}` : capPart;
        curBody.push((romOrPron && !/^[IVX]+$/.test(romOrPron) ? romOrPron + " " : "") + restBody);
        continue;
      }
    }

    if (curTitle) {
      curBody.push(line);
    }
  }
  flush();
}

async function importInsightFiles(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  const statusEl = getActiveEpubStatusEl();
  if (typeof JSZip === "undefined") {
    showBlueInfoModal("⚠️ Libreria Mancante", "Libreria JSZip non caricata. Verifica la connessione internet.");
    return;
  }
  try {
    const entries = [];
    const parser = new DOMParser();
    for (const file of files) {
      const fName = file.name.toLowerCase();
      statusEl.innerHTML = `⏳ Analisi di <b>${escapeHtml(file.name)}</b> in corso...`;
      if (fName.endsWith(".rtf") && !fName.endsWith(".zip")) {
        const buf = await file.arrayBuffer();
        const head = new Uint8Array(buf.slice(0, 4));
        const isZip = head[0] === 0x50 && head[1] === 0x4B;
        if (!isZip) {
          const rawRtf = new TextDecoder("windows-1252").decode(buf);
          const clean = parseRtfToCleanText(rawRtf);
          splitCleanTextIntoEntries(clean, entries);
          continue;
        }
      }
      const zip = await JSZip.loadAsync(file);
      const allPaths = Object.keys(zip.files).sort();
      const rtfFiles = allPaths.filter(p => p.toLowerCase().endsWith(".rtf") && !zip.files[p].dir);
      const htmlFiles = allPaths.filter(p => /\.(?:xhtml|html|htm)$/i.test(p) && !p.includes("toc") && !p.includes("nav") && !p.includes("cover") && !zip.files[p].dir);
      if (rtfFiles.length > 0) {
        for (let i = 0; i < rtfFiles.length; i++) {
          statusEl.innerHTML = `⚙️ Decodifica volume RTF ${i + 1}/${rtfFiles.length}...`;
          const uint8 = await zip.files[rtfFiles[i]].async("uint8array");
          const rawRtf = new TextDecoder("windows-1252").decode(uint8);
          const clean = parseRtfToCleanText(rawRtf);
          splitCleanTextIntoEntries(clean, entries);
        }
      } else if (htmlFiles.length > 0) {
        for (let i = 0; i < htmlFiles.length; i++) {
          if (i % 25 === 0) statusEl.innerHTML = `⚙️ Estrazione voci (${i + 1}/${htmlFiles.length})...`;
          const rawHtml = await zip.files[htmlFiles[i]].async("string");
          const doc = parser.parseFromString(rawHtml, "text/html");
          doc.querySelectorAll("script, style, rt, .footnote").forEach(el => el.remove());
          const body = doc.body || doc.documentElement;
          if (!body) continue;
          const hEl = body.querySelector("h1, h2, h3, strong");
          const title = hEl ? hEl.textContent.replace(/\s+/g, " ").trim() : "";
          const paras = [];
          body.querySelectorAll("p, div.p, li").forEach(p => {
            const t = p.textContent.replace(/\s+/g, " ").trim();
            if (t && t !== title) paras.push(t);
          });
          const bodyTxt = paras.length ? paras.join("\n\n") : body.textContent.replace(/\s+/g, " ").trim();
          if (title && bodyTxt.length > 20 && !/[\x00-\x08\x0E-\x1F]/.test(bodyTxt)) {
            const firstChar = title.normalize("NFD").replace(/[\u0300-\u036f]/g, "").charAt(0).toUpperCase();
            const letter = /[A-Z]/.test(firstChar) ? firstChar : "#";
            entries.push({ title, letter, body: bodyTxt });
          }
        }
      }
    }
    if (entries.length === 0) {
      throw new Error("Nessuna voce valida trovata. Assicurati di caricare l'archivio ZIP/RTF originale (it_I.zip) o un EPUB non corrotto.");
    }
    entries.sort((a, b) => a.title.localeCompare(b.title, "it"));
    const payload = { updated: Date.now(), count: entries.length, entries };
    insightMemCache = payload;
    statusEl.innerHTML = `💾 Salvataggio di ${entries.length} voci nel database offline...`;
    await saveOfflineBible("bm:insight_it", payload);
    statusEl.innerHTML = `✔ Perspicacia salvata offline (${entries.length} voci pronte)!`;
    setTimeout(() => {
      closeProModal();
      showInsightView();
    }, 900);
  } catch (err) {
    statusEl.innerHTML = `❌ Errore: ${escapeHtml(err.message)}`;
  }
}

async function getInsightData() {
  if (insightMemCache && Array.isArray(insightMemCache.entries)) return insightMemCache;
  try {
    const db = await openDB();
    return new Promise(res => {
      const tx = db.transaction("bibles", "readonly");
      const req = tx.objectStore("bibles").get("bm:insight_it");
      req.onsuccess = () => {
        if (req.result) insightMemCache = req.result;
        res(req.result || null);
      };
      req.onerror = () => res(null);
    });
  } catch (e) { console.debug(e); return null; }
}

function normalizeForSearch(str) {
  return (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function buildAccentInsensitiveRegex(term) {
  const clean = normalizeForSearch(term.trim()).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const map = {
    a: "[aàáâãäå]",
    e: "[eèéêë]",
    i: "[iìíîï]",
    o: "[oòóôõö]",
    u: "[uùúûü]"
  };
  const pattern = clean.replace(/[aeiou]/g, ch => map[ch] || ch);
  return new RegExp(`(${pattern})`, "gi");
}

function highlightHtmlSafe(htmlStr, term) {
  if (!term || term.trim().length < 2) return { html: htmlStr, count: 0 };
  const rgx = buildAccentInsensitiveRegex(term);
  let count = 0;
  const safeHtml = htmlStr.replace(/(<[^>]+>)|([^<]+)/g, (_match, tag, textNode) => {
    if (tag) return tag;
    return textNode.replace(rgx, (m) => {
      count++;
      return `<mark class="insight-hit" id="insight-hit-${count - 1}" style="background:#ffd54f; color:#111; font-weight:800; padding:1px 4px; border-radius:4px; text-decoration:underline; text-decoration-thickness:2px;">${m}</mark>`;
    });
  });
  return { html: safeHtml, count };
}

function jumpToInsightHit(step) {
  const hits = document.querySelectorAll(".insight-hit");
  if (!hits.length) return;
  hits.forEach(el => { el.style.outline = "none"; el.style.background = "#ffd54f"; });
  currentHitIdx = (currentHitIdx + step + hits.length) % hits.length;
  const target = hits[currentHitIdx];
  if (target) {
    target.style.background = "#ff9800";
    target.style.outline = "2px solid #fff";
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    const counterEl = document.getElementById("insightHitCounter");
    if (counterEl) counterEl.textContent = `${currentHitIdx + 1} / ${hits.length}`;
  }
}

async function renderInsightFilteredList() {
  const container = document.getElementById("insightListContainer");
  if (!container) return;
  const data = await getInsightData();
  if (!data || !Array.isArray(data.entries)) return;
  const rawQ = insightSearchQuery.trim();
  const q = normalizeForSearch(rawQ);
  const entries = data.entries;
  const exactTitleHits = [];   // 1° Esponente esatto o numerato (es. "GIOVANNI" o "GIOVANNI, I")
  const startsWordHits = [];   // 2° Titolo che inizia con quella parola intera (es. "GIOVANNI BATTISTA")
  const containsTitleHits = []; // 3° Titolo che contiene la parola (es. "VANGELO DI GIOVANNI")
  const bodyHits = [];         // 4° Parola presente nel testo della voce
  const escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // Riconosce "PAROLA", "PAROLA, I", "PAROLA (I)", "PAROLA 1" come Esponente Principale
  const exactOrNumberedRgx = q ? new RegExp(`^${escapedQ}(?:\\s*[,\\(\\s]\\s*(?:[ivx]+|\\d+)\\)?)?$`, "i") : null;
  const startsWordRgx = q ? new RegExp(`^${escapedQ}\\b`, "i") : null;
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (insightActiveLetter !== "TUTTE" && e.letter !== insightActiveLetter) continue;
    if (!q) {
      bodyHits.push({ idx: i, entry: e, matchType: "none", pos: 0 });
      if (bodyHits.length >= 150) break;
      continue;
    }
    const normTitle = normalizeForSearch(e.title).trim();
    if (normTitle === q || (exactOrNumberedRgx && exactOrNumberedRgx.test(normTitle))) {
      exactTitleHits.push({ idx: i, entry: e, matchType: "exact", pos: 0 });
    } else if (startsWordRgx && startsWordRgx.test(normTitle)) {
      startsWordHits.push({ idx: i, entry: e, matchType: "starts", pos: 0 });
    } else if (normTitle.startsWith(q) || normTitle.includes(q)) {
      containsTitleHits.push({ idx: i, entry: e, matchType: "title", pos: 0 });
    } else if (q.length >= 2 && bodyHits.length < 150) {
      const normBody = normalizeForSearch(e.body);
      const pos = normBody.indexOf(q);
      if (pos !== -1) {
        bodyHits.push({ idx: i, entry: e, matchType: "body", pos });
      }
    }
  }
  // Ordina i titoli del 2° gruppo dal più corto (più specifico) al più lungo
  startsWordHits.sort((a, b) => a.entry.title.length - b.entry.title.length);
  const combined = [...exactTitleHits, ...startsWordHits, ...containsTitleHits, ...bodyHits].slice(0, 150);
  if (combined.length === 0) {
    container.innerHTML = `<div class="loader">Nessun risultato trovato per "<b>${escapeHtml(rawQ)}</b>".</div>`;
    return;
  }
  const snippetRgx = q.length >= 2 ? buildAccentInsensitiveRegex(rawQ) : null;
  container.innerHTML = combined.map(({ idx, entry, matchType, pos }) => {
    let rawSnippet = "";
    if (matchType === "body" && pos > 40) {
      const start = Math.max(0, pos - 45);
      const end = Math.min(entry.body.length, pos + 110);
      rawSnippet = (start > 0 ? "…" : "") + entry.body.slice(start, end).replace(/\s+/g, " ") + (end < entry.body.length ? "…" : "");
    } else {
      rawSnippet = entry.body.slice(0, 145).replace(/\s+/g, " ") + (entry.body.length > 145 ? "…" : "");
    }
    let snippetHtml = escapeHtml(rawSnippet);
    if (snippetRgx) {
      snippetHtml = snippetHtml.replace(snippetRgx, '<mark style="background:#ffd54f; color:#111; font-weight:700; padding:0 3px; border-radius:3px;">$1</mark>');
    }
    const badge = matchType === "exact"
      ? `<span class="tag-badge" style="background:#2e7d32; color:#fff; font-size:11px; margin-left:6px;">★ Esponente Principale</span>`
      : (matchType === "starts" || matchType === "title")
      ? `<span class="tag-badge" style="background:var(--primary-main); color:#fff; font-size:11px; margin-left:6px;">Nel Titolo</span>`
      : q ? `<span class="tag-badge" style="font-size:11px; margin-left:6px;">Nel testo</span>` : "";
    return `
      <div class="result-card" onclick="showInsightView(${idx})">
        <div class="result-ref">📘 ${escapeHtml(entry.title)} ${badge}</div>
        <div class="bm-justify-text" style="font-size:13.5px; color:var(--text-muted); line-height:1.45;">${snippetHtml}</div>
      </div>
    `;
  }).join("");
}

let siMemCache = null;

function siSnippet(txt, len = 145) {
  const clean = String(txt || "").replace(/\[[a-z]{1,2}\]/g, "").replace(/\s+/g, " ").trim();
  return clean.slice(0, len) + (clean.length > len ? "…" : "");
}

function siPageBadge(p) {
  return p ? `<span class="tag-badge" style="font-size:11px; margin-left:6px;">p. ${escapeHtml(String(p))}</span>` : "";
}

function siBookLabel(b) {
  const ref = BIBLE_BOOKS.find(x => x.id === Number(b.bookNumber));
  return ref ? ref.name : (b.bookName || `Libro ${b.bookNumber}`);
}

function siExtraItems(data) {
  const flatExtras = [];
  const rawList = [...(data.frontMatter || []), ...(data.extras || [])];
  rawList.forEach(item => {
    if (!item || /risguardo/i.test(item.title || "")) return;
    if (Array.isArray(item.chapters) && item.chapters.length > 1) {
      item.chapters.forEach(ch => {
        flatExtras.push({
          title: ch.title || item.title,
          chapters: [ch]
        });
      });
    } else if (Array.isArray(item.chapters) && item.chapters.length === 1) {
      flatExtras.push(item);
    }
  });
  return flatExtras;
}

function siRenderParas(text, defaultBookId = null) {
  return String(text || "").split(/\n{2,}/).map(p => p.trim()).filter(Boolean).map(p => {
    const html = formatNoteLinks(p, defaultBookId).replace(
      /\[([a-z]{1,2})\]/g,
      '<sup onclick="document.getElementById(\'si_fn_$1\')?.scrollIntoView({behavior:\'smooth\',block:\'center\'})" style="color:var(--primary-light); font-weight:800; cursor:pointer; padding:0 2px;">[$1]</sup>'
    );
    const isMeta = /^(?:Scrittore|Scrittori|Dove fu scritto|Quando fu completato|Tempo a cui si riferisce):/i.test(p);
    if (isMeta) {
      return `<div style="font-size:0.92em; color:var(--text-muted); font-style:italic; margin:2px 0;">${html}</div>`;
    }
    const isQuestion = /^\d{1,3}(?:\s*[,–-]\s*\d{1,3})*\.\s/.test(p) && /\?\s*$/.test(p);
    return isQuestion
      ? `<div style="font-weight:800; color:var(--primary-light); margin:16px 0 6px 0;">${html}</div>`
      : `<div style="margin:0 0 10px 0;">${html}</div>`;
  }).join("");
}

async function importSiFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const statusEl = getActiveEpubStatusEl();
  const setStatus = html => {
    if (statusEl) statusEl.innerHTML = html;
  };
  try {
    setStatus(`⏳ Analisi di <b>${escapeHtml(file.name)}</b> in corso...`);
    const parsed = JSON.parse(await file.text());
    if (!parsed || !Array.isArray(parsed.books)) {
      throw new Error("File non valido: manca l'elenco dei libri (books). Carica tutta_la_scrittura.json.");
    }
    const books = parsed.books
      .filter(b => b && Array.isArray(b.chapters) && b.chapters.length > 0)
      .sort((a, b) => (Number(a.bookNumber) || 0) - (Number(b.bookNumber) || 0));
    if (books.length === 0) {
      throw new Error("Nessun libro valido trovato nel file JSON.");
    }
    const payload = {
      updated: Date.now(),
      title: parsed.title || "Tutta la Scrittura è ispirata da Dio e utile",
      frontMatter: Array.isArray(parsed.frontMatter) ? parsed.frontMatter : [],
      books,
      extras: Array.isArray(parsed.extras) ? parsed.extras : []
    };
    siMemCache = payload;
    setStatus(`💾 Salvataggio di ${books.length} libri nel database offline...`);
    await saveOfflineBible("bm:si_it", payload);
    setStatus(`✔ Tutta la Scrittura salvata offline (${books.length} libri pronti)!`);
    setTimeout(() => {
      closeProModal();
      showSiView();
    }, 900);
  } catch (err) {
    setStatus(`❌ Errore: ${escapeHtml(err.message)}`);
  }
}

async function getSiData() {
  if (siMemCache && Array.isArray(siMemCache.books)) return siMemCache;
  try {
    const db = await openDB();
    return new Promise(res => {
      const tx = db.transaction("bibles", "readonly");
      const req = tx.objectStore("bibles").get("bm:si_it");
      req.onsuccess = () => {
        if (req.result) siMemCache = req.result;
        res(req.result || null);
      };
      req.onerror = () => res(null);
    });
  } catch (e) {
    console.debug(e);
    return null;
  }
}

function extractSiPillLabel(kind, item, ch) {
  if (kind !== "x") return siBookLabel(item);
  const raw = String((ch && ch.title) || (item && item.title) || "").trim();
  const studioMatch = raw.match(/^(Studio\s+n\.\s*\d+|Studio\s+\d+)\s*[—–:-]\s*(.+)$/i);
  if (studioMatch) {
    const numPart = studioMatch[1].replace(/n\.\s*/i, "").trim();
    const topic = studioMatch[2].replace(/^(?:La\s+|Il\s+|Lo\s+|L['’]|I\s+|Gli\s+|Le\s+|Un\s+|Una\s+)/i, "").trim();
    return `${numPart}: ${topic}`;
  }
  return raw;
}

    : "";

}

const BP_DB_META = "bm:maps_gl";
const BP_DB_IMG = "bm:maps_gl_img:";
let bpMeta = null;          // dati leggeri (luoghi, legende, miniature); le immagini HD restano in IndexedDB
let bpPlaceMap = null;      // chiave normalizzata -> [indici in bpMeta.places]
let bpMaxKeyWords = 1;
let mapsSearchQuery = "";
let mapsSearchTimeout = null;

// ---------- IndexedDB (riusa openDB() dell'app, senza toccare la cache delle Bibbie) ----------
async function bpDbGet(key) {
  try {
    const db = await openDB();
    return await new Promise(res => {
      const req = db.transaction("bibles", "readonly").objectStore("bibles").get(key);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => res(null);
    });
  } catch (e) { console.debug(e); return null; }
}

async function bpDbPut(key, value) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("bibles", "readwrite");
    tx.objectStore("bibles").put(value, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error || new Error("Errore di scrittura"));
    tx.onabort = () => rej(tx.error || new Error("Spazio insufficiente o scrittura annullata"));
  });
}
function bpBuildPlaceMap() {
  bpPlaceMap = new Map();
  bpMaxKeyWords = 1;
  (bpMeta.places || []).forEach((p, i) => (p.k || []).forEach(k => {
    if (!bpPlaceMap.has(k)) bpPlaceMap.set(k, []);
    bpPlaceMap.get(k).push(i);
    const wc = k.split(" ").length;
    if (wc > bpMaxKeyWords) bpMaxKeyWords = wc;
  }));
}
async function bpGetMeta() {
  if (bpMeta) return bpMeta;
  const m = await bpDbGet(BP_DB_META);
  if (m && Array.isArray(m.places) && Array.isArray(m.maps)) { bpMeta = m; bpBuildPlaceMap(); }
  return bpMeta;
}

function bpMakeThumb(dataUri, w = 260) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const h = Math.max(1, Math.round(im.naturalHeight * w / im.naturalWidth));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(im, 0, 0, w, h);
      res(c.toDataURL("image/jpeg", 0.7));
    };
    im.onerror = () => res("");
    im.src = dataUri;
  });
}

async function importMapsArchive(event) {
  const inputEl = event.target;
  const file = inputEl && inputEl.files && inputEl.files[0];

  try {
    if (!/\.json$/i.test(file.name || "")) {
      throw new Error("Carica il file vedete_il_buon_paese.json (il .jwpub contiene testi cifrati e non può essere letto direttamente dall'app).");
    }
    setStatus(`⏳ Lettura di <b>${escapeHtml(file.name)}</b> in corso...`);
    const parsed = JSON.parse(await file.text());
    if (!parsed || parsed.format !== "vedete-il-buon-paese" || !Array.isArray(parsed.chapters) || !Array.isArray(parsed.places)) {
      throw new Error("File non valido: serve vedete_il_buon_paese.json.");
    }
    const chapters = [parsed.front, ...parsed.chapters].filter(Boolean);
    const list = [];
    chapters.forEach(c => (c.maps || []).forEach(m => list.push({ m, c })));
    const metaMaps = [];
    let n = 0;
    for (const { m, c } of list) {
      n++;
      setStatus(`💾 Salvataggio cartina HD ${n} di ${list.length}...`);
      await bpDbPut(BP_DB_IMG + m.id, m.image.dataUri);
      const thumb = await bpMakeThumb(m.image.dataUri);
      const { image, ...rest } = m;
      metaMaps.push({ ...rest, chapterTitle: c.title, thumb, image: { file: image.file, width: image.width, height: image.height, mime: image.mime } });
    }
    const meta = { updated: Date.now(), title: parsed.title, counts: parsed.counts, places: parsed.places, maps: metaMaps };
    await bpDbPut(BP_DB_META, meta);
    try { const dbOld = await openDB(); dbOld.transaction("bibles", "readwrite").objectStore("bibles").delete("bm:maps_it"); } catch (e) { console.debug(e); }
    bpMeta = meta;
    bpBuildPlaceMap();
    setStatus(`✔ Cartine salvate offline: ${metaMaps.length} cartine, ${meta.places.length} luoghi!`);
    setTimeout(() => { closeProModal(); showMapsView(); }, 800);
  } catch (err) {
    setStatus(`❌ Errore: ${escapeHtml(err.message || String(err))}`);

    inputEl.value = "";

const bpV = { map: null, cells: [], label: "", s: 1, x: 0, y: 0, fit: 1, minS: 0.5, maxS: 8, w: 0, h: 0, ptrs: new Map(), d0: 0, s0: 1, ax: 0, ay: 0, lastTap: 0, lastTapX: 0, lastTapY: 0, bound: false };
function bpMapById(id) { return (bpMeta && bpMeta.maps || []).find(m => m.id === id); }
function bpPages(pages) { return pages && pages.length ? (pages.length > 1 ? "pp. " : "p. ") + pages.join("–") : ""; }

function bpParseCell(c, grid) {
  const m = /^([A-Z])(\d{1,2})$/.exec(c || "");
  if (!m || !grid) return null;
  const col = m[1].charCodeAt(0) - 65, row = parseInt(m[2], 10) - 1;
  if (col < 0 || col >= grid.cols || row < 0 || row >= grid.rows) return null;
  const side = bpV.w / grid.cols;   // le celle sono quadrate: lato = larghezza / colonne (l'ultima riga può essere tagliata dal bordo)
  return { col, row, cw: side, ch: side };
}

function bpStepAdjacentMap(delta) {

function bpClamp() {
  const stage = document.getElementById("bpStage");
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const w = bpV.w * bpV.s, h = bpV.h * bpV.s;
  bpV.x = w <= sw ? (sw - w) / 2 : Math.min(0, Math.max(sw - w, bpV.x));
  bpV.y = h <= sh ? (sh - h) / 2 : Math.min(0, Math.max(sh - h, bpV.y));
}
function bpApply() {
  bpClamp();
  const wrap = document.getElementById("bpWrap");
  wrap.style.transform = `translate(${bpV.x}px, ${bpV.y}px) scale(${bpV.s})`;
  wrap.style.setProperty("--inv", String(1 / bpV.s));
}
function bpFitView() {
  const stage = document.getElementById("bpStage");
  bpV.fit = Math.min(stage.clientWidth / bpV.w, stage.clientHeight / bpV.h);
  bpV.minS = bpV.fit * 0.9;
  bpV.maxS = Math.max(bpV.fit * 10, 2);
  bpV.s = bpV.fit; bpV.x = 0; bpV.y = 0;
  bpApply();
}
function bpZoomAt(factor, px, py) {
  const ns = Math.min(bpV.maxS, Math.max(bpV.minS, bpV.s * factor));
  const ix = (px - bpV.x) / bpV.s, iy = (py - bpV.y) / bpV.s;
  bpV.s = ns; bpV.x = px - ix * ns; bpV.y = py - iy * ns;
  bpApply();
}
function bpZoomBtn(f) {
  const stage = document.getElementById("bpStage");
  bpZoomAt(f, stage.clientWidth / 2, stage.clientHeight / 2);
}
function bpZoomToCell(cell) {
  const c = bpParseCell(cell, bpV.map.grid);
  if (!c) return;
  const stage = document.getElementById("bpStage");
  const s = Math.min(bpV.maxS, Math.max(bpV.fit, (Math.min(stage.clientWidth, stage.clientHeight) / 3) / Math.max(c.cw, c.ch)));
  bpV.s = s;
  bpV.x = stage.clientWidth / 2 - (c.col + 0.5) * c.cw * s;
  bpV.y = stage.clientHeight / 2 - (c.row + 0.5) * c.ch * s;
  bpApply();
}
function bpDrawHighlights() {
  const wrap = document.getElementById("bpWrap");
  wrap.querySelectorAll(".bp-hl").forEach(n => n.remove());

    d.style.width = c.cw + "px"; d.style.height = c.ch + "px";
    wrap.appendChild(d);

}
function bpRenderChips() {
  const el = document.getElementById("bpChips");
  const map = bpV.map;

  if (bpV.cells.length) {
    html += `<span class="bp-chiplabel">${bpV.label ? escapeHtml(bpV.label) + " · " : ""}quadrato</span>` +

  } else if (map.hasGrid) {
    html += `<span class="bp-chiplabel">Griglia ${map.grid.letters[0]}–${map.grid.letters[map.grid.letters.length - 1]} × 1–${map.grid.rows}. Tocca 📋 per l’elenco dei luoghi.</span>`;
  } else {

}
function bpBindGestures() {
  if (bpV.bound) return;
  bpV.bound = true;
  const stage = document.getElementById("bpStage");
  const pos = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  stage.addEventListener("pointerdown", e => {
    stage.setPointerCapture(e.pointerId);
    bpV.ptrs.set(e.pointerId, pos(e));
    if (bpV.ptrs.size === 2) {
      const [a, b] = [...bpV.ptrs.values()];
      bpV.d0 = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      bpV.s0 = bpV.s;
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      bpV.ax = (mid.x - bpV.x) / bpV.s; bpV.ay = (mid.y - bpV.y) / bpV.s;
    }
  });
  stage.addEventListener("pointermove", e => {
    if (!bpV.ptrs.has(e.pointerId)) return;
    const p = pos(e), prev = bpV.ptrs.get(e.pointerId);
    bpV.ptrs.set(e.pointerId, p);
    if (bpV.ptrs.size === 1) {
      bpV.x += p.x - prev.x; bpV.y += p.y - prev.y;
      bpApply();
    } else if (bpV.ptrs.size === 2) {
      const [a, b] = [...bpV.ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      bpV.s = Math.min(bpV.maxS, Math.max(bpV.minS, bpV.s0 * d / bpV.d0));
      bpV.x = mid.x - bpV.ax * bpV.s; bpV.y = mid.y - bpV.ay * bpV.s;
      bpApply();
    }
  });
  const up = e => {
    const p = bpV.ptrs.get(e.pointerId);
    const wasSingle = bpV.ptrs.size === 1;
    bpV.ptrs.delete(e.pointerId);
    if (wasSingle && p && e.type === "pointerup") {
      const now = Date.now();
      if (now - bpV.lastTap < 320 && Math.hypot(p.x - bpV.lastTapX, p.y - bpV.lastTapY) < 30) {
        if (bpV.s > bpV.fit * 1.5) bpFitView(); else bpZoomAt(3, p.x, p.y);
        bpV.lastTap = 0;
      } else { bpV.lastTap = now; bpV.lastTapX = p.x; bpV.lastTapY = p.y; }
    }
  };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const p = pos(e);
    bpZoomAt(e.deltaY < 0 ? 1.18 : 1 / 1.18, p.x, p.y);
  }, { passive: false });
  window.addEventListener("resize", () => { if (document.getElementById("mapsViewer").style.display === "flex" && bpV.map) bpApply(); });
}

const rpSchedulesCache = {};
function buildYearlySchedule(planId) {
  if (rpSchedulesCache[planId]) return rpSchedulesCache[planId];
  let bookOrder = BIBLE_BOOKS.map(b => b.id);
  if (planId === "chronological") bookOrder = CHRONO_BOOK_ORDER;
  else if (planId === "writing") bookOrder = WRITING_BOOK_ORDER;
  else if (planId === "thematic") bookOrder = THEMATIC_BOOK_ORDER;
  const allCh = [];
  bookOrder.forEach(bId => {
    const b = getBook(bId);
    for (let c = 1; c <= b.ch; c++) {
      allCh.push({ bookId: b.id, abbr: b.abbr, name: b.name, ch: c });
    }
  });
  const total = allCh.length; // 1189 capitoli
  const days = [];
  for (let d = 0; d < 365; d++) {
    const startIdx = Math.floor((d * total) / 365);
    const endIdx = Math.floor(((d + 1) * total) / 365) - 1;
    const slice = allCh.slice(startIdx, endIdx + 1);
    const groups = [];
    slice.forEach(item => {
      const last = groups[groups.length - 1];
      if (last && last.bookId === item.bookId) {
        last.endCh = item.ch;
      } else {
        groups.push({ bookId: item.bookId, abbr: item.abbr, startCh: item.ch, endCh: item.ch });
      }
    });
    const label = groups.map(g => g.startCh === g.endCh ? `${g.abbr} ${g.startCh}` : `${g.abbr} ${g.startCh} - ${g.endCh}`).join("; ");
    days.push({
      dayNum: d + 1,
      label: label,
      firstBookId: slice[0].bookId,
      firstCh: slice[0].ch
    });
  }
  rpSchedulesCache[planId] = days;
  return days;
}
function getDayOfYearIndex() {

  const utcNow = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const utcStart = Date.UTC(now.getFullYear(), 0, 1);
  const diff = Math.floor((utcNow - utcStart) / 86400000);
  return Math.min(364, Math.max(0, diff));
}

function computeRpPaceStatus(doneCount, todayIdx) {
  const expectedDone = todayIdx + 1;
  const diff = doneCount - expectedDone;
  if (doneCount === 0) return `<span style="color:#9ec9ff;">Inizia il tuo viaggio</span>`;
  if (diff > 0) return `<span style="color:#ccff00; font-weight:800;">🔥 +${diff} gg in anticipo</span>`;
  if (diff === 0) return `<span style="color:#00e5ff; font-weight:800;">✨ Perfettamente in pari!</span>`;
  return `<span style="color:#ffd54f; font-weight:800;">⏳ ${Math.abs(diff)} gg da recuperare</span>`;
}

// ============================================================================
// MODULO "📍 DOVE SI TROVA?" PRO (Atlante Intelligente, Salto ai Versetti & Radar)
// ============================================================================
const BP_WORD = /[\p{L}\p{M}]+(?:[-ʽ][\p{L}\p{M}]+)*/gu;
const BP_PREP = new Set(["a","ad","da","di","in","presso","verso","fino","città","monte","paese","terra","valle","regione","deserto","nel","nella","dal","dalla","del","della","al","alla","sul","sulla","tra","fra"]);
const bpUi = { sel: [], all: [], scope: "", selLabel: "", byKey: new Map(), mapScore: new Map(), mapBest: 0, bestMapId: "", hlActive: true };

// Calcola la cartina più pertinente per il capitolo/testo aperto in base alla densità dei luoghi citati
function bpComputeMapScore(results) {
  const score = new Map();
  results.forEach(r => {
    const maps = new Set();
    r.idxs.forEach(i => (bpMeta.places[i].r || []).forEach(x => maps.add(x.m)));
    maps.forEach(m => score.set(m, (score.get(m) || 0) + 1));
  });
  bpUi.mapScore = score;
  let bestVal = 0, bestId = "";
  score.forEach((val, mId) => {
    if (val > bestVal) { bestVal = val; bestId = mId; }
  });
  bpUi.mapBest = bestVal;
  bpUi.bestMapId = bestId;
}

function bpModalOpen(title, html) {
  document.getElementById("proModalTitle").textContent = title;
  document.getElementById("proModalBody").innerHTML = html;
  document.getElementById("proModal").style.display = "flex";

function bpKeyOf(txt) {
  return (String(txt || "").replace(/[\u2010\u2011]/g, "-").match(BP_WORD) || []).map(w => w.toLowerCase()).join(" ");
}

// ---------- Riconoscimento intelligente dei luoghi nel testo ----------
function bpFindMatches(text) {
  const out = [];
  if (!bpMeta || !bpPlaceMap) return out;
  const t = String(text || "").replace(/[\u2010\u2011]/g, "-");
  const toks = [];
  BP_WORD.lastIndex = 0;
  let m;
  while ((m = BP_WORD.exec(t))) toks.push({ w: m[0], lw: m[0].toLowerCase(), s: m.index, e: m.index + m[0].length });
  const places = bpMeta.places;
  const gapOk = (a, b) => /^[\s’'‘ʼ]*$/.test(t.slice(toks[a].e, toks[b].s));
  for (let i = 0; i < toks.length;) {
    let hit = null, hitN = 0, key = "";
    if (/^\p{Lu}/u.test(toks[i].w)) {
      for (let n = Math.min(bpMaxKeyWords, toks.length - i); n >= 1; n--) {
        let ok = true;
        for (let j = i; j < i + n - 1; j++) if (!gapOk(j, j + 1)) { ok = false; break; }
        if (!ok) continue;
        const k = toks.slice(i, i + n).map(x => x.lw).join(" ");
        const idxs = bpPlaceMap.get(k);
        if (idxs) { hit = idxs; hitN = n; key = k; break; }
      }
    }
    if (hit) {
      let accept = true;
      if (hit.every(ix => places[ix].w)) {
        accept = i > 0 && BP_PREP.has(toks[i - 1].lw) && /^[ \t\u00a0]+$/.test(t.slice(toks[i - 1].e, toks[i].s));
      }
      if (accept) out.push({ s: toks[i].s, e: toks[i + hitN - 1].e, key, idxs: hit });
      i += hitN;
    } else i++;
  }
  return out;
}

// Scansiona il testo (e se siamo in un capitolo biblico estrae anche i numeri esatti dei versetti per ogni luogo!)
function bpScanText(text, verseRows = null) {
  const t = String(text || "").replace(/[\u2010\u2011]/g, "-");
  const found = new Map();
  bpFindMatches(t).forEach(m => {
    const f = found.get(m.key);
    if (f) f.count++;
    else found.set(m.key, { key: m.key, surface: t.slice(m.s, m.e), idxs: m.idxs, count: 1, first: m.s, verses: [] });
  });

  if (Array.isArray(verseRows) && verseRows.length > 0) {
    verseRows.forEach(r => {
      const idAttr = r.id || "";
      const vNum = idAttr.startsWith("v_") ? parseInt(idAttr.slice(2), 10) : 0;
      if (!vNum) return;
      const vTxt = r.getAttribute("data-text") || r.textContent || "";
      bpFindMatches(vTxt).forEach(m => {
        const item = found.get(m.key);
        if (item && !item.verses.includes(vNum)) {
          item.verses.push(vNum);
        }
      });
    });
  }

  return [...found.values()].sort((a, b) => a.first - b.first);
}

// ---------- Schede PRO dei luoghi, Salto nel Testo e Rimandi alle Cartine ----------
function bpGroupRefs(p) {
  const by = new Map();
  const add = (mapId, page, cell, alt) => {
    if (!by.has(mapId)) by.set(mapId, { mapId, pages: new Set(), cells: [], alt });
    const g = by.get(mapId);
    g.alt = g.alt && alt;
    if (page) g.pages.add(page);
    if (cell && !g.cells.includes(cell)) g.cells.push(cell);
  };
  (p.r || []).forEach(r => { add(r.m, r.p, r.g, false); (r.m2 || []).forEach(x => add(x, r.p, r.g, true)); });
  return [...by.values()]
    .map(g => ({ ...g, pages: [...g.pages].sort((a, b) => a - b) }))
    .sort((a, b) => (a.alt - b.alt) || ((bpUi.mapScore.get(b.mapId) || 0) - (bpUi.mapScore.get(a.mapId) || 0)) || (!!b.cells.length - !!a.cells.length) || a.mapId.localeCompare(b.mapId));
}

  const map = bpMapById(g.mapId);
  if (!map) return "";

  const star = isBest ? `<span class="tag-badge" style="background:#00e5ff; color:#041a42; font-size:10px; padding:1px 6px; margin-right:4px;">★ Consigliata</span>` : "";
  const cells = g.cells.length ? g.cells.join(", ") : (map.hasGrid ? "vedi mappa" : "senza griglia");
  return `<button class="bp-ref btn-color-anim" style="--btn-bg:#00b0ff; --btn-glow:rgba(0,229,255,0.75);" onclick="bpOpen(${pi}, ${gi})">
    <span>🗺️ ${star}${escapeHtml(map.title)}${g.alt ? " <i>(alt.)</i>" : ""}<span class="bp-sub"> · ${escapeHtml(bpPages(g.pages.length ? g.pages : map.pages))}</span></span>
    <b>${escapeHtml(cells)}</b></button>`;
}

function bpPlaceBlock(pi) {
  const p = bpMeta.places[pi];
  const groups = bpGroupRefs(p);

  </div>`;
}

    </div>
  `;

  if (r.idxs.length === 1) {
    const p = bpMeta.places[r.idxs[0]];
    const same = bpKeyOf(p.n) === bpKeyOf(r.surface);
    return `<div class="bp-card">
      <div class="bp-title"><span>📍 ${escapeHtml(r.surface)}${same ? "" : ` <span class="bp-sub">(${escapeHtml(p.n)})</span>`}</span>${cntBadge}</div>
      ${versePills}
      ${bpPlaceBlock(r.idxs[0])}
      ${quickStudyBar}
    </div>`;
  }
  return `<div class="bp-card">
    <div class="bp-title"><span>📍 ${escapeHtml(r.surface)} <span class="bp-sub">· ${r.idxs.length} luoghi omonimi</span></span>${cntBadge}</div>
    ${versePills}
    ${r.idxs.map(bpPlaceBlock).join("")}
    ${quickStudyBar}
  </div>`;
}

function bpSearchPlaces(q) {
  const qk = bpKeyOf(q);
  if (qk.length < 2 || !bpMeta) return [];
  const scored = [];
  (bpMeta.places || []).forEach((p, i) => {
    let best = 0;
    (p.k || []).forEach(k => {
      if (k === qk) best = Math.max(best, 4);
      else if (k.startsWith(qk)) best = Math.max(best, 3);
      else if (k.split(" ").some(w => w.startsWith(qk))) best = Math.max(best, 2);
      else if (k.includes(qk)) best = Math.max(best, 1);
    });
    if (best) scored.push([best, i]);
  });
  scored.sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  return scored.slice(0, 30).map(s => s[1]);
}

function bpOpen(pi, gi) {
  const g = bpGroupRefs(bpMeta.places[pi])[gi];
  if (g) {
    closeProModal();
    openMapViewer(g.mapId, g.cells, bpMeta.places[pi].n);

}

function bpOpenSurface(key, surface) {
  const idxs = bpPlaceMap && bpPlaceMap.get(key);
  if (!idxs) return;
  if (idxs.length === 1) {
    const p = bpMeta.places[idxs[0]];
    const prim = bpGroupRefs(p).filter(g => !g.alt);
    if (prim.length === 1) { openMapViewer(prim[0].mapId, prim[0].cells, p.n); return; }
  }
  bpModalOpen("📍 " + surface, bpCardHtml({ surface, idxs, count: 1, verses: [] }));
}

function bpClearHighlights() {
  const main = document.getElementById("mainContainer");
  if (!main) return;
  main.querySelectorAll("span.bm-place-hl").forEach(el => el.replaceWith(document.createTextNode(el.textContent || "")));
  main.normalize();
  bpUi.hlActive = false;
}

function bpHighlightDom() {
  const main = document.getElementById("mainContainer");
  if (!main || (currentViewContext && currentViewContext.type === "maps")) return;
  bpClearHighlights();
  bpUi.hlActive = true;
  const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      const p = node.parentElement;
      if (!p || p.closest("button, select, input, textarea, script, style, .tag-badge, .pub-ref-badge, .chapter-header, .section-title, .verse-num, .bm-place-hl, .bm-name-link")) return NodeFilter.FILTER_REJECT;
      return /\p{Lu}/u.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  let cur;
  while ((cur = walker.nextNode())) nodes.push(cur);
  nodes.forEach(tn => {
    const val = tn.nodeValue;
    const ms = bpFindMatches(val);
    if (!ms.length) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    ms.forEach(m => {
      if (m.s > last) frag.appendChild(document.createTextNode(val.slice(last, m.s)));
      const span = document.createElement("span");
      span.className = "bm-place-hl";
      span.textContent = val.slice(m.s, m.e);
      span.title = "📍 Tocca per aprire la cartina";
      span.onclick = ev => { ev.stopPropagation(); bpOpenSurface(m.key, span.textContent); };
      frag.appendChild(span);
      last = m.e;
    });
    if (last < val.length) frag.appendChild(document.createTextNode(val.slice(last)));
    tn.replaceWith(frag);
  });
}

function extractActiveViewTextForAnalysis() {
  return bpGetViewText().full.replace(/\s+/g, " ").trim();
}
function bpCitedRefs(text) {
  const html = formatNoteLinks(String(text || ""));
  const out = [], seen = new Set();
  const re = /jumpToRefString\('([^']*)'\)/g;
  let m;
  while ((m = re.exec(html))) {
    const r = m[1];
    if (/^[\p{L}\d\s:,\-–]+$/u.test(r) && !seen.has(r)) { seen.add(r); out.push(r); }
  }
  return out;
}

  const dd = String(targetDate.getDate()).padStart(2, "0");
  const dayKey = `${mm}-${dd}`;
  const entry = (savedDaily && savedDaily.days && savedDaily.days[dayKey]) ? savedDaily.days[dayKey] : null;
  const rawTheme = entry ? (entry.theme || "") : extractActiveViewTextForAnalysis().slice(0, 220);
  const rawComment = entry ? (entry.comment || "") : extractActiveViewTextForAnalysis();
  const bookStopNames = BIBLE_BOOKS.flatMap(b => [normalizeForSearch(b.name), normalizeForSearch(b.abbr)]);
  const stopWords = new Set([
    ...bookStopNames, "salmo", "capitolo", "versetto", "disse", "dice", "detto", "fece", "fatto", "fare",
    "uomo", "uomini", "giorno", "giorni", "tempo", "tempi", "cose", "cosa", "modo", "parte", "parti",

  ]);
  const cleanTheme = String(rawTheme || "")
    .replace(/\s*[—–-]\s*[1-3]?\s*[A-Za-zÀ-ÿ]+\.?\s*\d+.*$/, " ")
    .replace(/\([^)]*\)/g, " ")
    .replace(/[0-9]+/g, " ")

  const candidateWords = [];

  cleanTheme.split(/\s+/).forEach(w => {

  // luoghi citati, con rimando alla cartina (solo se le cartine sono state caricate)
  let placesHtml = "";
  const meta = await bpGetMeta();

let selectTouchStartPos = null;

document.addEventListener("touchstart", function(e) {
  const sel = e.target && e.target.closest ? e.target.closest("select") : null;
  if (sel && e.touches && e.touches[0]) {
    selectTouchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY, sel };
  } else {
    selectTouchStartPos = null;
  }
}, { passive: true, capture: true });

document.addEventListener("touchend", function(e) {
  if (!selectTouchStartPos) return;
  const t = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : null;
  const { x, y, sel } = selectTouchStartPos;
  selectTouchStartPos = null;
  if (t && Math.hypot(t.clientX - x, t.clientY - y) < 12) {
    e.preventDefault();
    e.stopPropagation();
    sel.blur();
    lastCustomSelectOpenAt = Date.now();
    openCustomSelectMenu(sel);
  }
}, { passive: false, capture: true });

["mousedown", "click"].forEach(evtName => {
  document.addEventListener(evtName, function(e) {
    const sel = e.target && e.target.closest ? e.target.closest("select") : null;
    if (!sel) return;
    e.preventDefault();
    e.stopPropagation();
    sel.blur();
    const now = Date.now();
    if (now - lastCustomSelectOpenAt > 300) {
      lastCustomSelectOpenAt = now;
      openCustomSelectMenu(sel);
    }
  }, { passive: false, capture: true });
});

document.addEventListener("keydown", function(e) {
  const sel = e.target && e.target.closest ? e.target.closest("select") : null;

// 2. NAVIGAZIONE SWIPE ORIZZONTALE A UNA MANO (Bibbia, Giorno, Perspicacia, SI)
// ============================================================================
let bmSwipeStartX = 0;
let bmSwipeStartY = 0;
let bmSwipeStartTime = 0;
let bmSwipeIgnore = false;

document.getElementById("mainContainer")?.addEventListener("touchstart", function(e) {
  if (!e.touches || e.touches.length !== 1) { bmSwipeIgnore = true; return; }
  const t = e.target;
  if (t && t.closest("input, textarea, select, .quick-menu-bar, .verse-action-bar, .rp-scroll-window")) {
    bmSwipeIgnore = true;
    return;
  }
  const sel = window.getSelection ? window.getSelection() : null;
  if (sel && !sel.isCollapsed) { bmSwipeIgnore = true; return; }
  bmSwipeIgnore = false;
  bmSwipeStartX = e.touches[0].clientX;
  bmSwipeStartY = e.touches[0].clientY;
  bmSwipeStartTime = Date.now();
}, { passive: true });

document.getElementById("mainContainer")?.addEventListener("touchend", function(e) {
  if (bmSwipeIgnore || !e.changedTouches || e.changedTouches.length !== 1) return;
  const elapsed = Date.now() - bmSwipeStartTime;
  if (elapsed > 650) return;
  const dx = e.changedTouches[0].clientX - bmSwipeStartX;
  const dy = e.changedTouches[0].clientY - bmSwipeStartY;
  if (Math.abs(dx) < 88 || Math.abs(dy) > 38 || Math.abs(dx) < Math.abs(dy) * 2.4) return;
  const anyModalOpen = ["proModal", "noteModal", "myReadModal", "bmSelectModal", "mapsViewer"].some(id => {
    const el = document.getElementById(id);
    return el && el.style.display === "flex";
  });
  if (anyModalOpen) return;

  const isNext = dx < 0; // Swipe verso sinistra -> Successivo; Swipe verso destra -> Precedente
  if (currentViewContext.type === "bible") {
    if (isNext) nextChapter(); else prevChapter();
  } else if (currentViewContext.type === "daily") {
    showDailyTextView(currentDailyOffset + (isNext ? 1 : -1), true);
  } else if (currentViewContext.type === "insight" && typeof currentViewContext.idx === "number") {
    const total = insightMemCache?.entries?.length || 0;
    const nextIdx = currentViewContext.idx + (isNext ? 1 : -1);
    if (nextIdx >= 0 && nextIdx < total) showInsightView(nextIdx);
  } else if (currentViewContext.type === "si" && currentViewContext.mode === "reader") {
    const data = siMemCache;
    if (!data) return;
    const list = currentViewContext.kind === "x" ? siExtraItems(data) : data.books;
    const i = currentViewContext.i;
    const ci = currentViewContext.ci;
    const item = list[i];
    if (!item) return;
    if (isNext) {
      if (ci < item.chapters.length - 1) showSiReader(currentViewContext.kind, i, ci + 1);
      else if (i < list.length - 1) showSiReader(currentViewContext.kind, i + 1, 0);
    } else {
      if (ci > 0) showSiReader(currentViewContext.kind, i, ci - 1);
      else if (i > 0) showSiReader(currentViewContext.kind, i - 1, list[i - 1].chapters.length - 1);
    }
  }
}, { passive: true });

async function executeOmniSearch() {
  const inpEl = document.getElementById("searchInput");
  const rawQuery = inpEl ? inpEl.value.trim() : "";
  const resDiv = document.getElementById("searchResults");
  if (!rawQuery || !resDiv) return;
  resDiv.innerHTML = `<div class="loader">🌐 Ricerca globale sui 4 Pilastri per "<b>${escapeHtml(rawQuery)}</b>" in corso...</div>`;
  await new Promise(r => setTimeout(r, 30));

  const qNorm = normalizeForSearch(rawQuery);
  let html = "";

  // 1. PERSPICACIA
  const insData = await getInsightData();
  if (insData && Array.isArray(insData.entries)) {
    const insHits = [];
    for (let i = 0; i < insData.entries.length; i++) {
      const e = insData.entries[i];
      const nTitle = normalizeForSearch(e.title);
      if (nTitle === qNorm || nTitle.startsWith(qNorm) || nTitle.includes(qNorm)) {
        insHits.push({ idx: i, entry: e, prio: nTitle === qNorm ? 1 : (nTitle.startsWith(qNorm) ? 2 : 3) });
      }
    }
    insHits.sort((a, b) => a.prio - b.prio || a.entry.title.length - b.entry.title.length);
    const topIns = insHits.slice(0, 6);
    html += `<div class="section-title"><span>📚 Perspicacia (${insHits.length} voci nel titolo)</span></div>`;
    if (topIns.length) {
      html += topIns.map(h => `
        <div class="result-card" onclick="insightSearchQuery='${escapeJsStr(rawQuery)}'; showInsightView(${h.idx})">
          <div class="result-ref">📘 ${escapeHtml(h.entry.title)}</div>
          <div class="bm-justify-text" style="font-size:13px; color:var(--text-muted);">${escapeHtml(h.entry.body.slice(0, 130).replace(/\s+/g, " "))}…</div>
        </div>
      `).join("");
    } else {
      html += `<div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Nessun titolo corrispondente. <span class="tag-badge" onclick="searchWordInInsight('${escapeJsStr(rawQuery)}')">Cerca nel testo di Perspicacia →</span></div>`;
    }
  }

  // 2. CARTINE BIBLICHE HD
  const mapsMeta = await bpGetMeta();
  if (mapsMeta) {
    const placeIdxs = bpSearchPlaces(rawQuery).slice(0, 5);
    html += `<div class="section-title"><span>🗺️ Cartine & Luoghi (${placeIdxs.length})</span></div>`;
    if (placeIdxs.length) {
      html += placeIdxs.map(pi => `<div class="bp-card">${bpPlaceBlock(pi)}</div>`).join("");
    } else {
      html += `<div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Nessun luogo geografico trovato.</div>`;
    }
  }

  // 3. TUTTA LA SCRITTURA
  const siData = await getSiData();
  if (siData && Array.isArray(siData.books)) {
    const siHits = [];
    siData.books.forEach((b, bi) => {
      const bTitle = siBookLabel(b);
      (b.chapters || []).forEach((c, ci) => {
        const hay = normalizeForSearch(`${bTitle} ${c.title} ${c.content}`);
        const pos = hay.indexOf(qNorm);
        if (pos !== -1) {
          siHits.push({ kind: "b", i: bi, ci, title: `${bTitle} — ${c.title}`, snippet: siSnippet(c.content, 130) });
        }
      });
    });
    const extras = siExtraItems(siData);
    extras.forEach((x, xi) => {
      const c = x.chapters[0];
      if (c && normalizeForSearch(`${x.title} ${c.content}`).includes(qNorm)) {
        siHits.push({ kind: "x", i: xi, ci: 0, title: x.title, snippet: siSnippet(c.content, 130) });
      }
    });
    html += `<div class="section-title"><span>📘 Tutta la Scrittura (${siHits.length} sezioni)</span></div>`;
    if (siHits.length) {
      html += siHits.slice(0, 5).map(h => `
        <div class="result-card" onclick="showSiReader('${h.kind}', ${h.i}, ${h.ci})">
          <div class="result-ref">📘 ${escapeHtml(h.title)}</div>
          <div class="bm-justify-text" style="font-size:13px; color:var(--text-muted);">${escapeHtml(h.snippet)}</div>
        </div>
      `).join("");
    } else {
      html += `<div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Nessuna occorrenza in Tutta la Scrittura.</div>`;
    }
  }

  // 4. RIMANDO IMMEDIATO CONCORDANZA BIBLICA
  html += `
    <div class="section-title"><span>📖 Concordanza Biblica</span></div>
    <button class="search-btn" style="width:100%; padding:12px;" onclick="executeSearch(1)">
      🔍 Mostra tutti i versetti biblici con "${escapeHtml(rawQuery)}"
    </button>
  `;

  resDiv.innerHTML = html;
}

let bmXRayReturnState = null;

function getXRayCleanSortTitle(nameStr) {
  return String(nameStr || "")
    .replace(/^[^:]+:\s*/, "")
    .replace(/^Bibbia\s+/i, "")
    .trim();
}

function sortXRayBiblesHierarchy(biblesList) {
  const langGroupRank = (lang) => {
    const l = String(lang || "").toLowerCase();
    if (l.includes("ital")) return 1;
    if (l.includes("span") || l.includes("espa")) return 2;
    if (l.includes("port")) return 3;
    if (l.includes("engl")) return 4;
    return 5;
  };

  const tnmPriorityRank = (id) => {
    if (id === "gb:bi12" || id === "gb:bi12_s" || id === "gb:bi12_e") return 1;
    if (id === "gb:nwt"  || id === "gb:nwt_s"  || id === "gb:nwt_tpo" || id === "gb:nwt_e") return 2;
    return 3;
  };

  return [...biblesList].sort((a, b) => {
    const gA = langGroupRank(a.lang);
    const gB = langGroupRank(b.lang);
    if (gA !== gB) return gA - gB;

    if (gA === 5) {
      const langCmp = String(a.lang || "").localeCompare(String(b.lang || ""), "it", { sensitivity: "base" });
      if (langCmp !== 0) return langCmp;
    }

    const pA = tnmPriorityRank(a.id);
    const pB = tnmPriorityRank(b.id);
    if (pA !== pB) return pA - pB;

    return getXRayCleanSortTitle(a.name).localeCompare(getXRayCleanSortTitle(b.name), "it", { sensitivity: "base" });
  });
}

function decorateXRayInterlinearRoots(htmlText) {
  if (!bmXRayRootsActive || !htmlText) return htmlText;
  const seenInVerse = new Set();
  return htmlText.replace(/(<[^>]+>)|([A-Za-zÀ-ÖØ-öø-ÿ]{3,})/g, (match, tag, word) => {
    if (tag) return tag;
    const low = word.toLowerCase();
    const d = PRO_STRONG_DICT[low];
    if (!d || seenInVerse.has(low)) return match;
    seenInVerse.add(low);
    const shortRoot = d.orig.split("/")[0].replace(/\([^)]*\)/g, "").trim();
    const shortCode = d.code.split("/")[0].trim();
    return `${word} <span onclick="event.stopPropagation(); showXRayRootPopup('${escapeJsStr(low)}')" title="${escapeHtml(d.orig)} — ${escapeHtml(d.def)}" style="display:inline-flex; align-items:center; gap:3px; background:linear-gradient(135deg, rgba(255,213,79,0.22), rgba(0,229,255,0.18)); color:#ffd54f; border:1px solid rgba(255,213,79,0.75); border-radius:6px; padding:0 5px; font-size:11px; font-weight:800; cursor:pointer; vertical-align:baseline;">${escapeHtml(shortRoot)}·${escapeHtml(shortCode)}</span>`;
  });
}

function formatXRayDiffWords(baseText, targetText, isPrimary = false) {
  let outHtml = escapeHtml(targetText);
  if (!isPrimary && bmXRayDiffActive && baseText && targetText && baseText !== targetText) {
    const baseWords = new Set(
      String(baseText).toLowerCase().replace(/[.,;:!?"'«»()\[\]—–-]/g, " ").split(/\s+/).filter(w => w.length > 2)
    );
    outHtml = String(targetText).split(/(\s+)/).map(tok => {
      const cleanW = tok.toLowerCase().replace(/[.,;:!?"'«»()\[\]—–-]/g, "");
      if (cleanW.length > 2 && !baseWords.has(cleanW)) {
        return `<span class="diff-word" style="font-weight:800; color:#ffd54f; background:rgba(255,213,79,0.24); padding:0 3px; border-radius:4px;">${escapeHtml(tok)}</span>`;
      }
      return escapeHtml(tok);
    }).join("");
  }
  return decorateXRayInterlinearRoots(outHtml);
}

async function openVerseXRayModal(forcedVerseNum) {
  bmHaptic(14);
  const book = getBook(state.bookId);
  const vNum = (typeof forcedVerseNum === "number" && forcedVerseNum > 0)
    ? forcedVerseNum
    : (state.selectedVerse || 1);
  state.selectedVerse = vNum;
  const domRow = document.getElementById(`v_${vNum}`);
  if (domRow) {
    state.selectedVerseText = domRow.getAttribute("data-text") || state.selectedVerseText || "";
  } else if (!state.selectedVerseText) {
    selectVerseDataFromDOM(vNum);
  }
  const rawVerse = state.selectedVerseText || "";
  const refStr = `${book.name} ${state.chapter}:${vNum}`;
  window.__lastXRayData = { bookId: state.bookId, chapter: state.chapter, verse: vNum, ref: refStr };
  if (typeof forcedVerseNum !== "number") closeActionBar();

  document.getElementById("proModalTitle").textContent = `🔬 Raggi X: ${refStr}`;
  const body = document.getElementById("proModalBody");
  body.innerHTML = `<div class="loader">🔬 Scansione poliglotta ed esegetica di <b>${escapeHtml(refStr)}</b> in corso...</div>`;
  document.getElementById("proModal").style.display = "flex";

  const candidateIds = [...new Set([state.trans1, state.trans2, state.trans3, ...state.downloadedBibles])];
  const rawLoadedList = [];

  for (const tId of candidateIds) {
    const bMeta = dynamicCatalog.find(b => b.id === tId) || CORE_BIBLES.find(b => b.id === tId);
    if (!bMeta) continue;
    let vTxt = "";
    const fullOff = await getOfflineBible(tId);
    if (fullOff && Array.isArray(fullOff.books)) {
      const bObj = fullOff.books.find(b => Number(b.nr) === Number(state.bookId));
      const cObj = bObj && bObj.chapters ? bObj.chapters.find(c => Number(c.chapter) === Number(state.chapter)) : null;
      const vObj = cObj && cObj.verses ? cObj.verses.find(v => Number(v.verse) === Number(vNum)) : null;
      if (vObj && vObj.text) vTxt = stripTagsToPlainText(vObj.text);
    } else {
      const cachedCh = safeGetStorage(`bm_ch_${tId}_${state.bookId}_${state.chapter}`);
      if (cachedCh) {
        try {
          const arr = JSON.parse(cachedCh);
