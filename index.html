    .parallel-toggle { background: var(--primary-light); color: #fff; border: none; padding: 7px 11px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .parallel-toggle.off { background: var(--bg-main); color: var(--text-muted); border: 1px solid var(--border-color); }
    main { flex: 1; overflow-y: auto; padding: 14px; }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--primary-light); font-weight: 800; margin: 16px 0 8px 0; border-bottom: 2px solid var(--primary-light); padding-bottom: 4px; }
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 5px; margin-bottom: 16px; }
    .book-tile { color: #fff; border: none; border-radius: 4px; height: 48px; padding: 6px; display: flex; align-items: center; justify-content: flex-start; cursor: pointer; font-weight: 700; font-size: 14.5px; }

    function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("BM_OfflineDB", 4);
    req.onupgradeneeded = e => e.target.result.createObjectStore("bibles");
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
}
async function getOfflineBible(id) {
  try {
    const db = await openDB();
    return new Promise(res => {
      const tx = db.transaction("bibles", "readonly");
      const req = tx.objectStore("bibles").get(id);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => res(null);
    });
  } catch(e) { return null; }
}
async function saveOfflineBible(id, data) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("bibles", "readwrite");
    tx.objectStore("bibles").put(data, id);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e);
  });
}
async function removeOfflineBible(id) {
  try {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction("bibles", "readwrite");
      tx.objectStore("bibles").delete(id);
      tx.oncomplete = () => res();
      tx.onerror = e => rej(e);
    });
  } catch(e) {}
}

function populateSelects() {
  const activeBibles = OFFICIAL_BIBLES.filter(b => state.downloadedBibles.includes(b.id));
  const s1 = document.getElementById("trans1");
  const s2 = document.getElementById("trans2");
  const html = activeBibles.map(t => `<option value="${t.id}">${t.name}</option>`).join("");
  s1.innerHTML = html; s2.innerHTML = html;
  if (activeBibles.some(b => b.id === state.trans1)) s1.value = state.trans1;
  else if (activeBibles.length > 0) state.trans1 = activeBibles[0].id;
  if (activeBibles.some(b => b.id === state.trans2)) s2.value = state.trans2;
}

function setActiveTab(tabId) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  const el = document.getElementById(tabId);
  if (el) el.classList.add("active");
}
function getBook(id) { return ALL_BOOKS.find(b => b.id === id) || ALL_BOOKS[0]; }

function showBooksView() {
  closeActionBar(); setActiveTab("tabBooks");
  const main = document.getElementById("mainContainer");
  main.innerHTML = `
    <div class="section-title">Scritture Ebraico-Aramaiche (39)</div>
    <div class="books-grid">${BIBLE_BOOKS.map(b => `<button class="book-tile cat-${b.cat}" onclick="showChaptersView(${b.id})">${b.abbr}</button>`).join("")}</div>
    <div class="section-title">Scritture Greche Cristiane (27)</div>
    <div class="books-grid">${BIBLE_BOOKS_NT.map(b => `<button class="book-tile cat-${b.cat}" onclick="showChaptersView(${b.id})">${b.abbr}</button>`).join("")}</div>
  `;
  main.scrollTop = 0;
}

function showChaptersView(bookId) {
  state.bookId = bookId; const book = getBook(bookId);
  if (book.ch === 1) { state.chapter = 1; loadChapterView(); return; }
  const main = document.getElementById("mainContainer");
  let btns = "";
  for (let i = 1; i <= book.ch; i++) {
    const isCurr = (i === state.chapter) ? "current" : "";
    btns += `<button class="chapter-tile ${isCurr}" onclick="selectChapter(${i})">${i}</button>`;
  }
  main.innerHTML = `
    <div class="chapter-header"><div class="chapter-title">${book.name} — Capitoli</div><button class="nav-btn" onclick="showBooksView()">← Libri</button></div>
    <div class="chapters-grid">${btns}</div>
  `;
  main.scrollTop = 0;
}
function selectChapter(ch) { state.chapter = ch; loadChapterView(); }
    async function fetchChapterData(transId, bookId, chapter) {
  const fullOffline = await getOfflineBible(transId);
  if (fullOffline && fullOffline.books) {
    const bObj = fullOffline.books.find(b => Number(b.nr) === Number(bookId));
    if (bObj && bObj.chapters) {
      const cObj = bObj.chapters.find(c => Number(c.chapter) === Number(chapter));
      if (cObj && cObj.verses) return cObj.verses;
    }
  }
  const cacheKey = `bm_ch_${transId}_${bookId}_${chapter}`;
  const cached = localStorage.getItem(cacheKey);
  if (cached) { const parsed = JSON.parse(cached); if (parsed && parsed.length > 0) return parsed; }
  const code = transId.split(":")[1];
  const res = await fetch(`https://api.getbible.net/v2/${code}/${bookId}/${chapter}.json`);
  if (!res.ok) throw new Error("Capitolo non disponibile");
  const data = await res.json();
  const verses = (data.verses || []).map(v => ({ verse: v.verse, text: v.text }));
  if (verses.length > 0) { try { localStorage.setItem(cacheKey, JSON.stringify(verses)); } catch(e) {} }
  return verses;
}

async function loadChapterView() {
  closeActionBar(); setActiveTab("tabRead");
  const book = getBook(state.bookId);
  document.getElementById("currentRefLabel").textContent = `${book.name} ${state.chapter}`;
  const main = document.getElementById("mainContainer");
  main.innerHTML = `<div class="loader">Caricamento di <b>${book.name} ${state.chapter}</b>...</div>`;
  try {
    const data1 = await fetchChapterData(state.trans1, state.bookId, state.chapter);
    let data2 = [];
    if (state.parallel) { try { data2 = await fetchChapterData(state.trans2, state.bookId, state.chapter); } catch(e) { data2 = []; } }
    let versesHtml = "";
    if (!state.parallel) {
      versesHtml = data1.map(v => {
        const key = `${state.bookId}_${state.chapter}_${v.verse}`;
        const hlClass = state.highlights[key] || "";
        const cleanText = (v.text || "").replace(/<[^>]*>?/gm, "").replace(/"/g, "&quot;");
        return `<div class="verse-row ${hlClass}" id="v_${v.verse}" data-text="${cleanText}" onclick="onVerseClick(${v.verse}, this.getAttribute('data-text'))"><span class="verse-num">${v.verse}</span><span>${v.text}</span></div>`;
      }).join("");
    } else {
      const map2 = {}; data2.forEach(v => map2[v.verse] = v.text);
      versesHtml = data1.map(v => {
        const key = `${state.bookId}_${state.chapter}_${v.verse}`;
        const hlClass = state.highlights[key] || "";
        const cleanText = (v.text || "").replace(/<[^>]*>?/gm, "").replace(/"/g, "&quot;");
        const text2 = map2[v.verse] || "—";
        return `<div class="parallel-row ${hlClass}" id="v_${v.verse}" data-text="${cleanText}" onclick="onVerseClick(${v.verse}, this.getAttribute('data-text'))"><div class="parallel-col"><span class="verse-num">${v.verse}</span>${v.text}</div><div class="parallel-col"><span class="verse-num">${v.verse}</span>${text2}</div></div>`;
      }).join("");
    }
    main.innerHTML = `
      <div class="chapter-header"><div class="chapter-title">${book.name} ${state.chapter}</div><div class="chapter-nav-btns"><button class="nav-btn" onclick="prevChapter()">◀ Prec</button><button class="nav-btn" onclick="nextChapter()">Succ ▶</button></div></div>
      <div>${versesHtml}</div>
    `;
    main.scrollTop = 0;
  } catch (err) {
    main.innerHTML = `<div class="loader">Capitolo non disponibile.<br><br><button class="nav-btn" onclick="showBooksView()">Scegli Libro</button></div>`;
  }
}

function prevChapter() {
  if (state.chapter > 1) state.chapter--;
  else if (state.bookId > 1) { state.bookId--; state.chapter = getBook(state.bookId).ch; }
  loadChapterView();
}
function nextChapter() {
  const book = getBook(state.bookId);
  if (state.chapter < book.ch) state.chapter++;
  else if (state.bookId < 66) { state.bookId++; state.chapter = 1; }
  loadChapterView();
}
function onTranslationChange() {
  state.trans1 = document.getElementById("trans1").value;
  state.trans2 = document.getElementById("trans2").value;
  loadChapterView();
}
function toggleParallel() {
  state.parallel = !state.parallel;
  const btn = document.getElementById("parallelBtn"), sel2 = document.getElementById("trans2");
  if (state.parallel) { btn.textContent = "⚖️ Parallelo: ON"; btn.classList.remove("off"); sel2.style.display = "block"; }
  else { btn.textContent = "⚖️ Parallelo: OFF"; btn.classList.add("off"); sel2.style.display = "none"; }
  loadChapterView();
}
    function onVerseClick(verseNum, text) { state.selectedVerse = verseNum; state.selectedVerseText = text; document.getElementById("verseActionBar").style.display = "flex"; }
function closeActionBar() { document.getElementById("verseActionBar").style.display = "none"; state.selectedVerse = null; }

function applyHighlight(colorClass) {
  if (!state.selectedVerse) return;
  const key = `${state.bookId}_${state.chapter}_${state.selectedVerse}`;
  if (colorClass) state.highlights[key] = colorClass; else delete state.highlights[key];
  localStorage.setItem("bm_hl", JSON.stringify(state.highlights));
  const row = document.getElementById(`v_${state.selectedVerse}`);
  if (row) { row.classList.remove("hl-yellow", "hl-blue", "hl-green", "hl-pink"); if (colorClass) row.classList.add(colorClass); }
  closeActionBar();
}
function saveBookmark() {
  if (!state.selectedVerse) return;
  const book = getBook(state.bookId);
  state.bookmarks.unshift({ bookId: state.bookId, chapter: state.chapter, verse: state.selectedVerse, ref: `${book.name} ${state.chapter}:${state.selectedVerse}`, text: state.selectedVerseText });
  localStorage.setItem("bm_bm", JSON.stringify(state.bookmarks));
  closeActionBar(); alert("Preferito salvato!");
}

function openNoteModalForVerse() {
  if (!state.selectedVerse) return;
  const book = getBook(state.bookId);
  const ref = `${book.name} ${state.chapter}:${state.selectedVerse}`;
  const text = prompt(`Scrivi un appunto per ${ref}:`, "");
  if (text !== null && text.trim() !== "") {
    state.notes.unshift({ id: Date.now(), ref, text: text.trim() });
    localStorage.setItem("bm_notes", JSON.stringify(state.notes));
    alert("Appunto salvato con successo!");
  }
  closeActionBar();
}

function showNotesView() {
  closeActionBar(); setActiveTab("tabNotes");
  const main = document.getElementById("mainContainer");
  if (!state.notes.length) {
    main.innerHTML = `<div class="loader">Nessun appunto salvato.<br><br>Tocca un versetto e premi l'icona 📝 per aggiungere una nota di studio.</div>`;
    return;
  }
  main.innerHTML = `<div class="section-title">I tuoi Appunti di Studio (${state.notes.length})</div>` +
    state.notes.map((n, idx) => `<div class="result-card"><div class="result-ref" style="display:flex;justify-content:space-between;"><span>📝 ${n.ref}</span><span onclick="deleteNote(${idx})" style="color:#e53935;cursor:pointer;">Elimina</span></div><div style="margin-top:6px;line-height:1.4;">${n.text}</div></div>`).join("");
}
function deleteNote(idx) { state.notes.splice(idx, 1); localStorage.setItem("bm_notes", JSON.stringify(state.notes)); showNotesView(); }

function showCatalogView() {
  closeActionBar(); setActiveTab("tabCatalog");
  const main = document.getElementById("mainContainer");
  main.innerHTML = `<div class="section-title">Centro Download Traduzioni</div><div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Gestisci le versioni della Bibbia. Clicca su "Scarica" per averla offline o "Rimuovi" per liberare spazio.</div><div id="catalogList"></div>`;
  renderCatalogList();
}
function renderCatalogList() {
  const container = document.getElementById("catalogList"); if (!container) return;
  container.innerHTML = OFFICIAL_BIBLES.map(b => {
    const isDown = state.downloadedBibles.includes(b.id);
    return `<div class="result-card" style="display:flex;justify-content:space-between;align-items:center;"><div><div class="result-ref">${b.name}</div><div style="font-size:12px;color:var(--text-muted);">Lingua: ${b.lang}</div></div><button class="badge-btn ${isDown ? 'downloaded' : ''}" onclick="toggleDownload('${b.id}')">${isDown ? '✔ Scaricata' : '⬇ Scarica'}</button></div>`;
  }).join("");
}
async function toggleDownload(id) {
  if (state.downloadedBibles.includes(id)) {
    if (state.downloadedBibles.length <= 1) { alert("Devi mantenere almeno una traduzione attiva!"); return; }
    state.downloadedBibles = state.downloadedBibles.filter(item => item !== id);
    await removeOfflineBible(id);
    localStorage.setItem("bm_down_bibles", JSON.stringify(state.downloadedBibles));
    populateSelects(); renderCatalogList(); alert("Traduzione rimossa.");
  } else {
    const code = id.split(":")[1];
    alert("Scaricamento di tutti i 66 libri in corso... attendi qualche secondo.");
    try {
      const res = await fetch(`https://api.getbible.net/v2/${code}.json`);
      const data = await res.json();
      await saveOfflineBible(id, data);
      state.downloadedBibles.push(id);
      localStorage.setItem("bm_down_bibles", JSON.stringify(state.downloadedBibles));
      populateSelects(); renderCatalogList(); alert("Traduzione scaricata e pronta offline!");
    } catch(e) { alert("Errore durante il download."); }
  }
}

function showSearchView() {
  closeActionBar(); setActiveTab("tabSearch");
  const main = document.getElementById("mainContainer");
  main.innerHTML = `<div class="search-box"><input type="text" id="searchInput" class="search-input" placeholder="Cerca parola..." onkeydown="if(event.key==='Enter') executeSearch()"><button class="search-btn" onclick="executeSearch()">Cerca</button></div><div id="searchResults"><div class="loader">Inserisci una parola da cercare nella Bibbia attiva.</div></div>`;
}
async function executeSearch() {
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!query) return;
  const resDiv = document.getElementById("searchResults");
  resDiv.innerHTML = `<div class="loader">Ricerca di "<b>${query}</b>" in corso...</div>`;
  try {
    let fullBible = await getOfflineBible(state.trans1);
    if (!fullBible) {
      const code = state.trans1.split(":")[1];
      const res = await fetch(`https://api.getbible.net/v2/${code}.json`);
      if (res.ok) { fullBible = await res.json(); await saveOfflineBible(state.trans1, fullBible); }
    }
    if (fullBible && fullBible.books) {
      let matches = [];
      for (const b of fullBible.books) {
        const bMeta = getBook(Number(b.nr));
        for (const c of b.chapters) {
          for (const v of c.verses) {
            if (v.text && v.text.toLowerCase().includes(query)) {
              matches.push({ bookId: Number(b.nr), bookName: bMeta.name, ch: c.chapter, v: v.verse, text: v.text });
              if (matches.length >= 80) break;
            }
          }
          if (matches.length >= 80) break;
        }
        if (matches.length >= 80) break;
      }
      if (!matches.length) { resDiv.innerHTML = `<div class="loader">Nessun risultato trovato per "${query}".</div>`; return; }
      resDiv.innerHTML = `<div style="margin-bottom:10px;font-size:13px;color:var(--text-muted);">Risultati trovati:</div>` +
        matches.map(m => `<div class="result-card" onclick="openRef(${m.bookId}, ${m.ch})"><div class="result-ref">${m.bookName} ${m.ch}:${m.v}</div><div>${m.text}</div></div>`).join("");
    } else { resDiv.innerHTML = `<div class="loader">Impossibile completare la ricerca.</div>`; }
  } catch (e) { resDiv.innerHTML = `<div class="loader">Errore durante la ricerca.</div>`; }
}

function showSavedView() {
  closeActionBar(); setActiveTab("tabSaved");
  const main = document.getElementById("mainContainer");
  if (!state.bookmarks.length) { main.innerHTML = `<div class="loader">Nessun preferito salvato.</div>`; return; }
  main.innerHTML = `<div class="section-title">I tuoi Preferiti (${state.bookmarks.length})</div>` +
    state.bookmarks.map((b, idx) => `<div class="result-card" onclick="openRef(${b.bookId}, ${b.chapter})"><div class="result-ref" style="display:flex;justify-content:space-between;"><span>🔖 ${b.ref}</span><span onclick="event.stopPropagation();deleteBookmark(${idx})" style="color:#e53935;">Elimina</span></div><div>${b.text}</div></div>`).join("");
}
function deleteBookmark(idx) { state.bookmarks.splice(idx, 1); localStorage.setItem("bm_bm", JSON.stringify(state.bookmarks)); showSavedView(); }
function openRef(bookId, chapter) { state.bookId = bookId; state.chapter = chapter; loadChapterView(); }

function changeFontSize(delta) {
  state.fontSize = Math.min(28, Math.max(14, state.fontSize + delta));
  document.documentElement.style.setProperty("--font-size-verse", state.fontSize + "px");
}
function toggleDarkMode() { document.body.classList.toggle("dark-mode"); }

populateSelects();
loadChapterView().then(() => {
  setTimeout(() => {
    const splash = document.getElementById("splashScreen");
    if(splash) { splash.style.opacity = "0"; setTimeout(() => splash.remove(), 400); }
  }, 600);
});
</script>
