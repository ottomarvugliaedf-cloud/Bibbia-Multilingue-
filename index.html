// 📊 Mappa Termica (Heatmap) e Statistiche Avanzate dei 66 Libri
function openStudyAnalyticsModal() {
  bmChimeHaptic();
  closeActionBar();

  const bookStats = new Map();
  for (let i = 1; i <= 66; i++) bookStats.set(i, { hl: 0, bm: 0, notes: 0, total: 0 });

  Object.keys(state.highlights || {}).forEach(k => {
    const bId = Number(k.split("_")[0]);
    if (bookStats.has(bId)) {
      const s = bookStats.get(bId);
      s.hl++; s.total++;
    }
  });
  (state.bookmarks || []).forEach(b => {
    const bId = Number(b.bookId);
    if (bookStats.has(bId)) {
      const s = bookStats.get(bId);
      s.bm++; s.total += 2;
    }
  });
  (state.notes || []).forEach(n => {
    const bId = Number(n.bookId);
    if (bookStats.has(bId)) {
      const s = bookStats.get(bId);
      s.notes++; s.total += 3;
    }
  });

  const totalHl = Object.keys(state.highlights || {}).length;
  const totalBm = (state.bookmarks || []).length;
  const totalNotes = (state.notes || []).length;
  const touchedBooks = Array.from(bookStats.values()).filter(s => s.total > 0).length;
  const studyMins = Number(safeGetStorage("bm_study_minutes_v1")) || 0;
  const studyTimeFormatted = studyMins >= 60
    ? `${Math.floor(studyMins / 60)}h ${studyMins % 60}m`
    : `${studyMins} min`;

  const heatmapGrid = BIBLE_BOOKS.map(b => {
    const st = bookStats.get(b.id);
    let bg = "#041a42";
    let border = "rgba(41,182,246,0.28)";
    let txtCol = "#8ca0ba";
    if (st.total >= 8) {
      bg = "linear-gradient(135deg, #00e5ff, #00b0ff)";
      border = "#ffffff";
      txtCol = "#041a42";
    } else if (st.total >= 3) {
      bg = "#1565c0";
      border = "#00e5ff";
      txtCol = "#ffffff";
    } else if (st.total >= 1) {
      bg = "#0a367e";
      border = "#29b6f6";
      txtCol = "#e3f2fd";
    }
    return `<button type="button" onclick="closeProModal(); openRef(${b.id}, 1);" title="${escapeHtml(b.name)}: ${st.hl} evid., ${st.bm} pref., ${st.notes} note" style="background:${bg}; color:${txtCol}; border:1px solid ${border}; border-radius:6px; padding:5px 2px; font-size:11px; font-weight:800; cursor:pointer; text-align:center;">
      ${escapeHtml(b.abbr)}${st.total > 0 ? `<div style="font-size:9px; opacity:0.9;">★${st.hl + st.bm + st.notes}</div>` : ""}
    </button>`;
  }).join("");

  document.getElementById("proModalTitle").textContent = "📊 Statistiche & Heatmap Studio PRO";
  document.getElementById("proModalBody").innerHTML = `
    <div style="background:linear-gradient(135deg, #041a42, #062356); border:1px solid #00e5ff; border-radius:9px; padding:8px 12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:12.5px; font-weight:800; color:#cfe3ff;">⏱️ Tempo di Studio Attivo:</span>
      <span style="font-size:14.5px; font-weight:900; color:#00e5ff;">${studyTimeFormatted}</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:12px; text-align:center;">
      <div style="background:#062356; border:1px solid #29b6f6; border-radius:8px; padding:8px 4px;">
        <div style="font-size:17px; font-weight:900; color:#00e5ff;">${touchedBooks}/66</div>
        <div style="font-size:10.5px; color:#9ec9ff; font-weight:700;">Libri Studiati</div>
      </div>
      <div style="background:#062356; border:1px solid #29b6f6; border-radius:8px; padding:8px 4px; cursor:pointer;" onclick="closeProModal(); showSavedView();">
        <div style="font-size:17px; font-weight:900; color:#ffeb3b;">${totalHl}</div>
        <div style="font-size:10.5px; color:#9ec9ff; font-weight:700;">Evidenziati</div>
      </div>
      <div style="background:#062356; border:1px solid #29b6f6; border-radius:8px; padding:8px 4px; cursor:pointer;" onclick="closeProModal(); showSavedView();">
        <div style="font-size:17px; font-weight:900; color:#4fc3f7;">${totalBm}</div>
        <div style="font-size:10.5px; color:#9ec9ff; font-weight:700;">Preferiti</div>
      </div>
      <div style="background:#062356; border:1px solid #29b6f6; border-radius:8px; padding:8px 4px; cursor:pointer;" onclick="closeProModal(); showNotesView();">
        <div style="font-size:17px; font-weight:900; color:#ccff00;">${totalNotes}</div>
        <div style="font-size:10.5px; color:#9ec9ff; font-weight:700;">Appunti</div>
      </div>
    </div>
    <div class="section-title">
      <span>🔥 Mappa Termica dei 66 Libri</span>
      <span>Tocca per aprire</span>
    </div>
    <div style="font-size:11.5px; color:#cfe3ff; margin-bottom:8px;">
      Più un libro è luminoso, più versetti evidenziati, preferiti e note di studio contiene:
    </div>
    <div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:5px; max-height:40vh; overflow-y:auto; padding:2px;">
      ${heatmapGrid}
    </div>
  `;
  document.getElementById("proModal").style.display = "flex";
}

// 🧘 Modalità Focus Zen (Lettura a tutto schermo senza distrazioni)
let bmZenModeActive = false;
function toggleBmZenMode() {
  bmChimeHaptic();
  bmZenModeActive = !bmZenModeActive;
  const transBar = document.querySelector(".trans-bar");
  const quickBar = document.querySelector(".quick-menu-bar");
  const botNav = document.querySelector("nav.bottom-nav");
  if (transBar) transBar.style.display = bmZenModeActive ? "none" : "";
  if (quickBar) quickBar.style.display = bmZenModeActive ? "none" : "";
  if (botNav) botNav.style.display = bmZenModeActive ? "none" : "";

  let zenExitBtn = document.getElementById("bmZenExitFloatingBtn");
  if (bmZenModeActive) {
    if (!zenExitBtn) {
      zenExitBtn = document.createElement("button");
      zenExitBtn.id = "bmZenExitFloatingBtn";
      zenExitBtn.innerHTML = "🧘 Esci da Focus";
      zenExitBtn.style.cssText = "position:fixed; bottom:18px; right:16px; z-index:900; background:rgba(6,35,86,0.92); color:#00e5ff; border:1.5px solid #00e5ff; border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:900; box-shadow:0 6px 20px rgba(0,0,0,0.6), 0 0 12px rgba(0,229,255,0.45); backdrop-filter:blur(6px); cursor:pointer;";

      document.body.appendChild(zenExitBtn);
    }
    zenExitBtn.style.display = "inline-flex";
  } else if (zenExitBtn) {
    zenExitBtn.style.display = "none";

  { b: 1, c: 26, v: "4", cat: "Discendenza", desc: "La promessa del Seme messianico viene confermata a Isacco.", nt: ["Luca 3:34", "Galati 3:16"], ntCited: true },
  { b: 1, c: 28, v: "12", cat: "Ministero", desc: "La scala di Giacobbe: il mezzo di comunicazione fra il cielo e la terra.", nt: ["Giovanni 1:51"], ntCited: true },

  { b: 2, c: 12, v: "5, 21-27", cat: "Pasqua", desc: "L'agnello pasquale senza difetto il cui sangue preserva dalla morte.", nt: ["1 Corinti 5:7", "Giovanni 1:29", "1 Pietro 1:19"], ntCited: true },

  { b: 2, c: 16, v: "4, 15", cat: "Ministero", desc: "La manna dal cielo prefigura il vero Pane della vita disceso dal cielo.", nt: ["Giovanni 6:31-35", "Giovanni 6:48-51"], ntCited: true },
  { b: 2, c: 17, v: "6", cat: "Ministero", desc: "La roccia percossa nel deserto da cui sgorga acqua viva.", nt: ["1 Corinti 10:4", "Giovanni 7:37-38"], ntCited: true },

  { b: 4, c: 24, v: "17", cat: "Regalità", desc: "Una stella certamente procederà da Giacobbe e uno scettro sorgerà da Israele.", nt: ["Matteo 2:2", "2 Pietro 1:19", "Rivelazione 22:16"], ntCited: true },

  { b: 8, c: 4, v: "18-22", cat: "Genealogia", desc: "La linea genealogica da Perez a Boaz, Obed, Iesse e Davide.", nt: ["Matteo 1:3-6", "Luca 3:31-33"], ntCited: true },
  { b: 9, c: 2, v: "10", cat: "Regalità", desc: "Geova darà forza al suo Re ed esalterà il corno del suo Unto (Messia).", nt: ["Luca 1:69"], ntCited: true },
  { b: 10, c: 7, v: "12-16", cat: "Patto Davidico", desc: "Il trono della discendenza di Davide sarà stabilito fermamente a tempo indefinito.", nt: ["Luca 1:32-33", "Atti 2:29-30", "Ebrei 1:5"], ntCited: true },

  { b: 19, c: 16, v: "8-11", cat: "Risurrezione", desc: "Non lascerai la mia anima nello Sceol, né permetterai che il tuo leale veda la fossa (corruzione).", nt: ["Atti 2:25-31", "Atti 13:35-37"], ntCited: true },

  { b: 19, c: 22, v: "7-8", cat: "Crocifissione", desc: "Si fanno beffe di lui, scuotono il capo: 'Si è affidato a Geova, lo salvi lui!'", nt: ["Matteo 27:39-43", "Luca 23:35"], ntCited: true },

  { b: 19, c: 22, v: "16", cat: "Crocifissione", desc: "Hanno forato (come un leone) le mie mani e i miei piedi.", nt: ["Giovanni 20:25-27", "Luca 24:39-40"], ntCited: true },
  { b: 19, c: 22, v: "18", cat: "Crocifissione", desc: "Si dividono le mie vesti e tirano a sorte sulla mia tunica.", nt: ["Giovanni 19:23-24", "Matteo 27:35"], ntCited: true },
  { b: 19, c: 22, v: "22", cat: "Risurrezione", desc: "Dichiarerò il tuo nome ai miei fratelli; in mezzo alla congregazione ti loderò.", nt: ["Ebrei 2:12", "Giovanni 20:17"], ntCited: true },
  { b: 19, c: 23, v: "1", cat: "Pastore", desc: "Il Pastore eccellente che guida e dà la vita per le sue pecore.", nt: ["Giovanni 10:11", "1 Pietro 2:25"], ntCited: true },
  { b: 19, c: 31, v: "5", cat: "Crocifissione", desc: "'Nelle tue mani affido il mio spirito.'", nt: ["Luca 23:46"], ntCited: true },

  { b: 19, c: 35, v: "19", cat: "Rifiuto", desc: "Mi hanno odiato senza motivo.", nt: ["Giovanni 15:25"], ntCited: true },
  { b: 19, c: 40, v: "6-8", cat: "Sacrificio", desc: "'Ecco, io vengo, nel rotolo del libro è scritto di me. Ho provato diletto nel fare la tua volontà.'", nt: ["Ebrei 10:5-10"], ntCited: true },
  { b: 19, c: 41, v: "9", cat: "Tradimento", desc: "Anche l'uomo che era in pace con me, che mangiava il mio pane, ha alzato contro di me il calcagno.", nt: ["Giovanni 13:18", "Giovanni 13:26"], ntCited: true },

  { b: 19, c: 68, v: "18", cat: "Ascensione", desc: "Sei salito in alto, hai condotto prigionieri; hai preso doni sotto forma di uomini.", nt: ["Efesini 4:8"], ntCited: true },

  { b: 19, c: 69, v: "20-21", cat: "Crocifissione", desc: "Per cibo mi diedero pianta velenosa (fiele), e per la mia sete cercarono di farmi bere aceto.", nt: ["Matteo 27:34", "Matteo 27:48", "Giovanni 19:29"], ntCited: true },
  { b: 19, c: 69, v: "25", cat: "Traditore", desc: "Il suo accampamento divenga desolato, e nelle sue tende non ci sia chi abiti (applicato a Giuda).", nt: ["Atti 1:20"], ntCited: true },

let bmProphecyList = [...CORE_MESSIANIC_PROPHECIES];
let bmCurrentProphecyIdx = 0;
let bmBubbleExpanded = true;
let bmDailyStartProphecy = safeJsonParse("bm_messianic_daily_origin_v1", null);
let bmPrevLongPressTimer = null;
let bmPrevLongPressFired = false;
let bmDynamicCatalogEnriched = false;

function isValidMessianicOtCoordinate(bookId, ch, firstVerseNum = 1) {
  const b = Number(bookId);
  const c = Number(ch);
  const v = Number(firstVerseNum) || 1;
  if (b < 1 || b > 39) return false;
  if (b === 1 && c < 3) return false;
  if (b === 1 && c === 3 && v < 15) return false;
  return true;
}

function getFirstVerseNumFromSpec(vSpec) {
  const m = String(vSpec || "1").match(/(\d{1,3})/);
  return m ? parseInt(m[1], 10) : 1;
}

// Auto-Arricchimento che conserva SEMPRE il testo INTEGRALE (fullDesc) oltre all'anteprima breve (desc)
async function enrichMessianicPropheciesFromOfflineDB() {
  if (bmDynamicCatalogEnriched) return bmProphecyList;
  bmDynamicCatalogEnriched = true;

  const seenKeys = new Set(bmProphecyList.map(p => `${p.b}_${p.c}_${getFirstVerseNumFromSpec(p.v)}`));

  const addDiscoveredProphecy = (bId, chNum, vSpec, fullParagraphText, ntArr = [], catStr = "Profezia", sourceMeta = null) => {
    const firstV = getFirstVerseNumFromSpec(vSpec);
    if (!isValidMessianicOtCoordinate(bId, chNum, firstV)) return;
    const key = `${bId}_${chNum}_${firstV}`;
    if (seenKeys.has(key)) return;
    seenKeys.add(key);

    const cleanFull = String(fullParagraphText || "")
      .replace(/\[[a-z]{1,2}\]/g, "")
      .replace(/\s+/g, " ")
      .trim();
    const isLong = cleanFull.length > 165;
    const shortPreview = isLong ? (cleanFull.slice(0, 160).trim() + "…") : cleanFull;

    bmProphecyList.push({
      b: Number(bId),
      c: Number(chNum),
      v: String(vSpec || firstV),
      cat: catStr,
      desc: shortPreview || "Profezia messianica e relativo adempimento scritturale.",
      fullDesc: cleanFull || shortPreview,
      isTruncated: isLong,
      sourceMeta: sourceMeta,
      nt: ntArr,
      ntCited: ntArr.length > 0
    });
  };

  try {
    // 1. Perspicacia (voci Messia, Gesù Cristo, Profezia, Seme, Cristo, Unto)
    const ins = await getInsightData();
    if (ins && Array.isArray(ins.entries)) {
      ins.entries.forEach((art, artIdx) => {
        if (!/^(?:MESSIA|GES[ÙU]\s+CRISTO|PROFEZIA|SEME|CRISTO|UNTO)\b/i.test(art.title || "")) return;
        const lines = String(art.body || "").split(/\n+/);
        lines.forEach(line => {
          if (line.length < 15) return;
          const refs = bpCitedRefs(line);
          if (refs.length >= 2) {
            const parsedRefs = refs.map(r => ({ raw: r, t: parseRefStringToTarget(r) })).filter(x => x.t);
            const otRefs = parsedRefs.filter(x => isValidMessianicOtCoordinate(x.t.bookId, x.t.chapter, getFirstVerseNumFromSpec(x.t.vSpec)));
            const ntRefs = parsedRefs.filter(x => x.t.bookId >= 40 && x.t.bookId <= 66).map(x => `${x.t.book.name} ${x.t.chapter}${x.t.vSpec ? ":" + x.t.vSpec : ""}`);
            if (otRefs.length > 0 && otRefs.length <= 4 && ntRefs.length > 0) {
              otRefs.forEach(ot => {
                addDiscoveredProphecy(
                  ot.t.bookId,
                  ot.t.chapter,
                  ot.t.vSpec || "1",
                  line,
                  ntRefs.slice(0, 6),
                  "Adempimento",
                  { type: "insight", idx: artIdx, label: `📚 Perspicacia: ${art.title}` }
                );
              });
            }
          }
        });
      });
    }


    // 2. Tutta la Scrittura (si_I) — conserva l'intero paragrafo + coordinate per aprire il capitolo SI
    const si = await getSiData();
    if (si && Array.isArray(si.books)) {
      si.books.forEach((bObj, bi) => {
        const bNum = Number(bObj.bookNumber);
        if (bNum < 1 || bNum > 39) return;
        (bObj.chapters || []).forEach((chObj, ci) => {
          const paras = String(chObj.content || "").split(/\n{2,}/);
          paras.forEach(p => {
            if (!/(?:\bgesù|\b(?:messia\w*|ademp\w*|cristo|seme|unto|profetizz\w*)\b)/i.test(p)) return;
            const refs = bpCitedRefs(p);
            const parsedRefs = refs.map(r => ({ raw: r, t: parseRefStringToTarget(r) })).filter(x => x.t);
            const otRefs = parsedRefs.filter(x => isValidMessianicOtCoordinate(x.t.bookId, x.t.chapter, getFirstVerseNumFromSpec(x.t.vSpec)));
            const ntRefs = parsedRefs.filter(x => x.t.bookId >= 40 && x.t.bookId <= 66).map(x => `${x.t.book.name} ${x.t.chapter}${x.t.vSpec ? ":" + x.t.vSpec : ""}`);
            if (otRefs.length > 0 && otRefs.length <= 4 && ntRefs.length > 0) {
              otRefs.forEach(ot => {
                addDiscoveredProphecy(
                  ot.t.bookId,
                  ot.t.chapter,
                  ot.t.vSpec || "1",
                  p,
                  ntRefs.slice(0, 6),
                  "Scritture",
                  { type: "si", bi, ci, label: `📘 Tutta la Scrittura: ${getBook(bNum).name}` }
                );
              });
            }
          });
        });
      });
    }

  } catch (e) {
    console.debug(e);
  }

  bmProphecyList.sort((a, b) => {
    if (a.b !== b.b) return a.b - b.b;
    if (a.c !== b.c) return a.c - b.c;
    return getFirstVerseNumFromSpec(a.v) - getFirstVerseNumFromSpec(b.v);
  });

  return bmProphecyList;
}

function recordDailyStartingProphecyIfNeeded(prophecyIdx) {
  const todayStr = new Date().toISOString().slice(0, 10);
  if (!bmDailyStartProphecy || bmDailyStartProphecy.date !== todayStr || typeof bmDailyStartProphecy.idx !== "number") {
    const p = bmProphecyList[prophecyIdx];
    if (!p) return;
    const book = getBook(p.b);
    bmDailyStartProphecy = {
      date: todayStr,
      idx: prophecyIdx,
      b: p.b,
      c: p.c,
      v: p.v,
      label: `${book.abbr} ${p.c}:${p.v}`
    };
    safeSaveStorage("bm_messianic_daily_origin_v1", JSON.stringify(bmDailyStartProphecy));
  }
}

function findPropheciesForCurrentChapter(bookId, chapter) {
  const b = Number(bookId);
  const c = Number(chapter);

  if (b >= 1 && b <= 39) {
    if (b === 1 && c < 3) return [];
    const matches = [];
    bmProphecyList.forEach((p, idx) => {
      if (p.b === b && p.c === c) {
        if (b === 1 && c === 3 && getFirstVerseNumFromSpec(p.v) < 15) return;
        matches.push(idx);
      }
    });
    return matches;
  }

  if (b >= 40 && b <= 66) {
    const curBookName = getBook(b).name.toLowerCase();
    const prefix = `${curBookName} ${c}:`;
    const exactCh = `${curBookName} ${c}`;
    const matches = [];
    bmProphecyList.forEach((p, idx) => {
      if ((p.nt || []).some(r => {
        const low = r.toLowerCase();
        return low.startsWith(prefix) || low === exactCh;
      })) {
        matches.push(idx);
      }
    });
    return matches;
  }
  return [];
}

function highlightMessianicVersesInDOM(prophecyObj, shouldScroll = false) {
  document.querySelectorAll(".bm-messianic-verse-box").forEach(el => {
    el.classList.remove("bm-messianic-verse-box");
  });
  if (!prophecyObj || (typeof bmSettings !== "undefined" && bmSettings.messianicBulb === false)) return;

  let targetVerses = [];
  if (state.bookId === prophecyObj.b && state.chapter === prophecyObj.c) {
    targetVerses = parseVerseSpecToArray(prophecyObj.v);
  } else if (state.bookId >= 40) {
    const curBookName = getBook(state.bookId).name.toLowerCase();
    const prefix = `${curBookName} ${state.chapter}:`;
    (prophecyObj.nt || []).forEach(ntRef => {
      if (ntRef.toLowerCase().startsWith(prefix)) {
        const vPart = ntRef.split(":")[1] || "";
        targetVerses.push(...parseVerseSpecToArray(vPart));
      }
    });
  }

  if (!targetVerses.length) return;
  let firstEl = null;
  targetVerses.forEach(vNum => {
    const row = document.getElementById(`v_${vNum}`);
    if (row) {
      row.classList.add("bm-messianic-verse-box");
      if (!firstEl) firstEl = row;
    }
  });
  if (shouldScroll && firstEl) {
    firstEl.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

function focusCurrentMessianicVerses() {
  bmHaptic(16);
  const p = bmProphecyList[bmCurrentProphecyIdx];
  if (!p) return;
  if (state.bookId !== p.b || state.chapter !== p.c) {
    jumpToMessianicProphecyIndex(bmCurrentProphecyIdx, true);
  } else {
    highlightMessianicVersesInDOM(p, true);
  }
}

    return;

  if (!p) {
    widget.classList.remove("visible");

  recordDailyStartingProphecyIfNeeded(bmCurrentProphecyIdx);

  const book = getBook(p.b);
  const refStr = `${book.name} ${p.c}:${p.v}`;
  const badgeEl = document.getElementById("bmBulbBadge");
  const counterEl = document.getElementById("bmPbCounter");
  const refEl = document.getElementById("bmPbRef");
  const catEl = document.getElementById("bmPbCategory");
  const descEl = document.getElementById("bmPbDesc");
  const greekBtn = document.getElementById("bmPbGreekBtn");
  const greekLbl = document.getElementById("bmPbGreekLabel");
  const originHint = document.getElementById("bmPbOriginHint");

  if (badgeEl) badgeEl.textContent = String(chapterMatches.length);
  if (counterEl) counterEl.textContent = `#${bmCurrentProphecyIdx + 1}/${bmProphecyList.length}`;
  if (refEl) refEl.textContent = `📖 ${refStr}`;
  if (catEl) catEl.textContent = p.cat || "Messia";
  if (descEl) {
    const moreBadge = p.isTruncated ? `<span class="bm-pb-readmore">📖 Leggi tutto</span>` : "";
    descEl.innerHTML = `${escapeHtml(p.desc)}${moreBadge}`;
  }

  if (greekBtn && greekLbl) {
    if (p.nt && p.nt.length > 0) {
      const firstNt = p.nt[0];
      const moreCnt = p.nt.length > 1 ? ` (+${p.nt.length - 1})` : "";
      greekLbl.textContent = `Greche: ${firstNt}${moreCnt}`;
      greekBtn.style.opacity = "1";
    } else {
      greekLbl.textContent = p.isTruncated ? `📖 Nota Integrale & NT` : `Greche: Vedi Citate`;
      greekBtn.style.opacity = "0.96";
    }
  }

  if (originHint && bmDailyStartProphecy) {
    originHint.textContent = `⏱️ Tieni premuto ◀ → 1ª di oggi (${bmDailyStartProphecy.label})`;
  }

  const bubble = document.getElementById("bmProphecyBubble");
  if (bubble) {
    bubble.classList.toggle("minimized", !bmBubbleExpanded);
  }

  widget.classList.add("visible");
  applySavedBulbPosition();
}

function toggleMessianicBubble(forceState) {
  bmHaptic(14);
  bmBubbleExpanded = typeof forceState === "boolean" ? forceState : !bmBubbleExpanded;
  const bubble = document.getElementById("bmProphecyBubble");
  if (bubble) {
    bubble.classList.toggle("minimized", !bmBubbleExpanded);
  }
}

function stepMessianicProphecy(delta) {
  bmChimeHaptic();
  if (!bmProphecyList.length) return;
  const nextIdx = (bmCurrentProphecyIdx + delta + bmProphecyList.length) % bmProphecyList.length;
  jumpToMessianicProphecyIndex(nextIdx, true);
}

function jumpToMessianicProphecyIndex(targetIdx, expandBubble = true) {
  const p = bmProphecyList[targetIdx];
  if (!p) return;
  bmCurrentProphecyIdx = targetIdx;
  if (expandBubble) bmBubbleExpanded = true;
  recordDailyStartingProphecyIfNeeded(targetIdx);

  closeProModal();
  const myReadModal = document.getElementById("myReadModal");
  if (myReadModal) myReadModal.style.display = "none";

  if (currentViewContext.type === "bible" && state.bookId === p.b && state.chapter === p.c) {
    const matches = findPropheciesForCurrentChapter(state.bookId, state.chapter);
    renderMessianicWidgetUI(matches.length ? matches : [targetIdx]);
    highlightMessianicVersesInDOM(p, true);
    scrollToVerseAndHighlight(p.v);
    return;
  }

  saveCurrentPositionToHistory(p.b, p.c);
  state.bookId = p.b;
  state.chapter = p.c;
  window.__bmPendingProphecyIdx = targetIdx;
  loadChapterView().then(() => {
    setTimeout(() => {
      highlightMessianicVersesInDOM(p, true);
      scrollToVerseAndHighlight(p.v);
    }, 260);
  });
}

function onMessianicPrevDown(ev) {
  if (ev && ev.button !== undefined && ev.button !== 0) return;
  bmPrevLongPressFired = false;
  clearTimeout(bmPrevLongPressTimer);
  bmPrevLongPressTimer = setTimeout(() => {
    bmPrevLongPressFired = true;
    bmChimeHaptic();
    returnToDailyOriginProphecy();
  }, 560);
}

function onMessianicPrevUp() {
  clearTimeout(bmPrevLongPressTimer);
}

function onMessianicPrevClick(ev) {
  clearTimeout(bmPrevLongPressTimer);
  if (bmPrevLongPressFired) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    bmPrevLongPressFired = false;
    return;
  }
  stepMessianicProphecy(-1);
}

function returnToDailyOriginProphecy() {
  if (!bmDailyStartProphecy) {
    stepMessianicProphecy(-1);
    return;
  }
  let originIdx = bmProphecyList.findIndex(p =>
    p.b === bmDailyStartProphecy.b &&
    p.c === bmDailyStartProphecy.c &&
    String(p.v) === String(bmDailyStartProphecy.v)
  );
  if (originIdx === -1) {
    originIdx = Math.min(bmProphecyList.length - 1, Math.max(0, Number(bmDailyStartProphecy.idx) || 0));
  }
  jumpToMessianicProphecyIndex(originIdx, true);
}

// Apre direttamente la fonte originale (Tutta la Scrittura o Perspicacia) da cui proviene la nota
function openProphecySourceDocument(idx) {
  const p = bmProphecyList[idx];
  if (!p || !p.sourceMeta) return;
  const modal = document.getElementById("myReadModal");
  if (modal) modal.style.display = "none";
  closeProModal();
  if (p.sourceMeta.type === "si") {
    showSiReader("b", p.sourceMeta.bi, p.sourceMeta.ci);
  } else if (p.sourceMeta.type === "insight") {
    showInsightView(p.sourceMeta.idx);
  }
}

// Finestra Modale con TESTO INTEGRALE (non tagliato!), versetti cliccabili e pulsante alla fonte
function openGreekFulfillmentAction() {
  bmChimeHaptic();
  const p = bmProphecyList[bmCurrentProphecyIdx];
  if (!p) return;

  const book = getBook(p.b);
  const otRef = `${book.name} ${p.c}:${p.v}`;
  const ntList = Array.isArray(p.nt) ? p.nt : [];
  const fullText = p.fullDesc || p.desc || "";

  const modal = document.getElementById("myReadModal");
  const body = document.getElementById("myReadModalBody");
  if (!modal || !body) {
    if (ntList.length > 0) jumpToRefString(ntList[0], true);
    return;
  }

  const formattedFullNote = formatNoteLinks(fullText, p.b);

  const sourceBtnHtml = p.sourceMeta ? `
    <button type="button" class="myread-action-btn btn-color-anim"
      style="background:#062356; border-color:#00e5ff; color:#84ffff; font-size:12.5px; padding:8px 10px; margin-bottom:10px;"
      onclick="openProphecySourceDocument(${bmCurrentProphecyIdx})">
      ${escapeHtml(p.sourceMeta.label)} — Apri capitolo intero ▶
    </button>
  ` : "";

  const ntButtonsHtml = ntList.length > 0
    ? ntList.map(r => `
        <button type="button" class="myread-action-btn btn-color-anim"
          style="--btn-bg:#ffd54f; --btn-glow:rgba(255,213,79,0.85); background:linear-gradient(135deg, #1565c0, #0d47a1); border-color:#ffd54f; display:flex; justify-content:space-between; align-items:center;"
          onclick="document.getElementById('myReadModal').style.display='none'; jumpToRefString('${escapeJsStr(r)}', true)">
          <span>🏛️ Apri ${escapeHtml(r)}</span>
          <span style="color:#ffd54f; font-size:12px;">Vai al cap. ▶</span>
        </button>
      `).join("")
    : `<div style="font-size:12.5px; color:#9ec9ff; text-align:center; padding:6px;">Tocca qualsiasi versetto azzurro nella nota qui sopra per aprirlo direttamente.</div>`;

  body.innerHTML = `
    <div style="text-align:center; padding:2px 0 10px 0;">
      <div style="font-size:26px; margin-bottom:2px;">🏛️✨</div>
      <div style="font-size:15px; font-weight:900; color:#ffd54f; margin-bottom:3px;">Adempimento nelle Scritture Greche Cristiane</div>
      <div style="font-size:13.5px; font-weight:800; color:#00e5ff;">Profezia: ${escapeHtml(otRef)}</div>
    </div>
    <div class="bm-justify-text" style="background:#062356; border:1px solid rgba(41,182,246,0.55); border-radius:10px; padding:11px 12px; max-height:38vh; overflow-y:auto; font-size:13.5px; line-height:1.56; color:#ffffff; margin-bottom:10px;">
      ${formattedFullNote}
    </div>
    ${sourceBtnHtml}
    <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;">
      ${ntButtonsHtml}
    </div>
    <hr style="border:none; border-top:1px solid rgba(41,182,246,0.35); margin:10px 0;">
    <div style="display:flex; gap:8px;">
      <button type="button" class="myread-action-btn" style="background:#062356; flex:1;" onclick="document.getElementById('myReadModal').style.display='none'">Chiudi</button>
      <button type="button" class="myread-action-btn" style="background:linear-gradient(135deg, #00838f, #00acc1); border-color:#84ffff; flex:1.5;" onclick="document.getElementById('myReadModal').style.display='none'; openMessianicCatalogModal(true);">
        📜 Tutte le Citate nel NT
      </button>
    </div>
  `;
  modal.style.display = "flex";
}

let bmMessianicOnlyNtFilter = false;
let bmMessianicSearchQ = "";

function openMessianicCatalogModal(onlyNtCited = false) {
  bmChimeHaptic();
  bmMessianicOnlyNtFilter = Boolean(onlyNtCited);
  document.getElementById("proModalTitle").textContent = `💡 Profezie Messianiche (${bmProphecyList.length})`;
  document.getElementById("proModal").style.display = "flex";
  renderMessianicCatalogModalBody();
}

function renderMessianicCatalogModalBody() {
  const body = document.getElementById("proModalBody");
  if (!body) return;

  const q = (bmMessianicSearchQ || "").trim().toLowerCase();
  const filtered = bmProphecyList
    .map((p, idx) => ({ p, idx }))
    .filter(({ p }) => {
      if (bmMessianicOnlyNtFilter && (!p.nt || p.nt.length === 0)) return false;
      if (!q) return true;
      const bName = getBook(p.b).name.toLowerCase();
      const hay = `${bName} ${p.c}:${p.v} ${p.cat} ${p.fullDesc || p.desc} ${(p.nt || []).join(" ")}`.toLowerCase();
      return hay.includes(q);
    });

  const originBanner = bmDailyStartProphecy ? `
    <div style="display:flex; justify-content:space-between; align-items:center; background:#041a42; border:1px solid #ffd54f; border-radius:9px; padding:7px 11px; margin-bottom:10px; font-size:12.5px;">
      <span>🕯️ 1ª Profezia letta oggi: <b style="color:#ffd54f;">${escapeHtml(bmDailyStartProphecy.label)}</b></span>
      <button type="button" class="tag-badge" style="background:#ffd54f; color:#041a42; border-color:#fff; font-weight:900;" onclick="returnToDailyOriginProphecy()">↩ Torna lì</button>
    </div>
  ` : "";

  body.innerHTML = `
    ${originBanner}
    <div class="search-box" style="margin-bottom:8px;">
      <input type="search" class="search-input" value="${escapeHtml(bmMessianicSearchQ)}" placeholder="🔍 Cerca passo, tema o citazione greca (es. Betleem, Sal 22, Matteo)..." oninput="bmMessianicSearchQ=this.value; renderMessianicCatalogModalBody();">
    </div>
    <div style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;">
      <button type="button" class="nav-btn" style="flex:1; font-size:12px; ${!bmMessianicOnlyNtFilter ? 'background:#00e5ff;color:#041a42;font-weight:900;' : ''}" onclick="bmMessianicOnlyNtFilter=false; renderMessianicCatalogModalBody();">
        📜 Tutte da Gen 3:15 (${bmProphecyList.length})
      </button>
      <button type="button" class="nav-btn" style="flex:1.2; font-size:12px; ${bmMessianicOnlyNtFilter ? 'background:#ffd54f;color:#041a42;border-color:#fff;font-weight:900;' : 'border-color:#ffd54f;color:#ffd54f;'}" onclick="bmMessianicOnlyNtFilter=true; renderMessianicCatalogModalBody();">
        🏛️ Citate nelle Scritture Greche (${bmProphecyList.filter(x => x.nt && x.nt.length > 0).length})
      </button>
    </div>
    <div style="max-height:54vh; overflow-y:auto; padding-right:2px;">
      ${filtered.map(({ p, idx }) => {
        const bObj = getBook(p.b);
        const ref = `${bObj.name} ${p.c}:${p.v}`;
        const fullText = p.fullDesc || p.desc || "";
        const ntPills = (p.nt || []).map(ntRef =>
          `<span class="tag-badge" style="background:rgba(255,213,79,0.18); color:#ffd54f; border-color:#ffd54f;" onclick="event.stopPropagation(); closeProModal(); jumpToRefString('${escapeJsStr(ntRef)}', true)">🏛️ ${escapeHtml(ntRef)}</span>`
        ).join(" ");
        return `
          <div class="result-card" style="margin-bottom:7px; border-left:3px solid ${p.nt && p.nt.length ? '#ffd54f' : '#00e5ff'};" onclick="jumpToMessianicProphecyIndex(${idx}, true)">
            <div class="result-ref" style="display:flex; justify-content:space-between; align-items:center;">
              <span>💡 #${idx + 1} • ${escapeHtml(ref)}</span>
              <span class="tag-badge" style="font-size:10.5px;">${escapeHtml(p.cat || 'Profezia')}</span>
            </div>
            <div class="bm-justify-text" style="font-size:13px; color:#e3f2fd; line-height:1.46; margin:4px 0 6px 0;">${escapeHtml(fullText)}</div>
            ${ntPills ? `<div style="display:flex; flex-wrap:wrap; gap:4px;">${ntPills}</div>` : ""}
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function applySavedBulbPosition() {
  const widget = document.getElementById("bmProphecyWidget");
  if (!widget) return;
  const savedPos = safeJsonParse("bm_bulb_pos_v1", null);
  if (savedPos && typeof savedPos.right === "number" && typeof savedPos.bottom === "number") {
    const maxR = Math.max(8, window.innerWidth - 64);
    const maxB = Math.max(74, window.innerHeight - 64);
    widget.style.right = Math.min(maxR, Math.max(8, savedPos.right)) + "px";
    widget.style.bottom = Math.min(maxB, Math.max(74, savedPos.bottom)) + "px";
  }
}

(function initBulbDragAndTap() {
  const orb = document.getElementById("bmBulbOrb");
  const widget = document.getElementById("bmProphecyWidget");
  if (!orb || !widget) return;

  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0;
  let startRight = 14, startBottom = 84;

  orb.addEventListener("pointerdown", e => {
    dragging = true;
    moved = false;
    orb.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startY = e.clientY;
    const rect = widget.getBoundingClientRect();
    startRight = window.innerWidth - rect.right;
    startBottom = window.innerHeight - rect.bottom;
  });

  orb.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.hypot(dx, dy) > 7) moved = true;
    if (!moved) return;

    const newRight = Math.min(window.innerWidth - 64, Math.max(6, startRight - dx));
    const newBottom = Math.min(window.innerHeight - 64, Math.max(70, startBottom - dy));
    widget.style.right = Math.round(newRight) + "px";
    widget.style.bottom = Math.round(newBottom) + "px";
  });

  const endDrag = e => {
    if (!dragging) return;
    dragging = false;
    try { orb.releasePointerCapture(e.pointerId); } catch (err) { console.debug(err); }
    if (moved) {
      const rect = widget.getBoundingClientRect();
      safeSaveStorage("bm_bulb_pos_v1", JSON.stringify({
        right: Math.round(window.innerWidth - rect.right),
        bottom: Math.round(window.innerHeight - rect.bottom)
      }));
    } else {
      toggleMessianicBubble();
    }
  };

  orb.addEventListener("pointerup", endDrag);
  orb.addEventListener("pointercancel", endDrag);
})();

async function evaluateMessianicBulbForCurrentView() {
  const widget = document.getElementById("bmProphecyWidget");
  if (!widget) return;

  // Se l'utente ha disattivato la lampadina nelle impostazioni, nasconde il widget e pulisce i riquadri
  if (typeof bmSettings !== "undefined" && bmSettings.messianicBulb === false) {
    widget.classList.remove("visible");
    document.querySelectorAll(".bm-messianic-verse-box").forEach(el => el.classList.remove("bm-messianic-verse-box"));
    return;
  }

  if (!currentViewContext || currentViewContext.type !== "bible") {
    widget.classList.remove("visible");
    return;
  }

  await enrichMessianicPropheciesFromOfflineDB();
  const matches = findPropheciesForCurrentChapter(state.bookId, state.chapter);

  if (!matches.length) {
    widget.classList.remove("visible");
    return;
  }

  if (typeof window.__bmPendingProphecyIdx === "number" && matches.includes(window.__bmPendingProphecyIdx)) {
    bmCurrentProphecyIdx = window.__bmPendingProphecyIdx;
    window.__bmPendingProphecyIdx = null;
  } else if (!matches.includes(bmCurrentProphecyIdx)) {
    bmCurrentProphecyIdx = matches[0];
  }

  renderMessianicWidgetUI(matches);
  highlightMessianicVersesInDOM(bmProphecyList[bmCurrentProphecyIdx], false);
}
